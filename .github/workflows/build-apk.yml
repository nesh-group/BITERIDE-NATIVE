              public void canShowOverApps(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("granted", android.os.Build.VERSION.SDK_INT < 23 || android.provider.Settings.canDrawOverlays(getContext()));
                  call.resolve(r);
              }

              // Opens the system "Display over other apps" screen for this app.
              @PluginMethod
              public void requestOverlayPermission(PluginCall call) {
                  try {
                      Intent i = new Intent(
                          android.provider.Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          android.net.Uri.parse("package:" + getContext().getPackageName())
                      );
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  } catch (Exception ignored) {}
                  call.resolve();
              }

              // Android 14+: is the "Full-screen notifications" permission on? (Always true below 14.)
              @PluginMethod
              public void canUseFullScreenIntent(PluginCall call) {
                  JSObject r = new JSObject();
                  boolean ok = true;
                  if (android.os.Build.VERSION.SDK_INT >= 34) {
                      android.app.NotificationManager nm = getContext().getSystemService(android.app.NotificationManager.class);
                      ok = nm == null || nm.canUseFullScreenIntent();
                  }
                  r.put("granted", ok);
                  r.put("supported", android.os.Build.VERSION.SDK_INT >= 34);
                  call.resolve(r);
              }

              // Opens this app's "Full-screen notifications" settings screen (Android 14+).
              @PluginMethod
              public void openFullScreenIntentSettings(PluginCall call) {
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 34) {
                          Intent i = new Intent(
                              android.provider.Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT,
                              android.net.Uri.parse("package:" + getContext().getPackageName())
                          );
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);

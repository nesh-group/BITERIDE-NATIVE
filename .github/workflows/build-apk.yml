          cat > "$PKG_PATH/RingingService.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.core.app.NotificationCompat;

          // Foreground service that loops the alert sound + vibration for
          // as long as a ride or order sits un-answered, even with the app
          // fully closed. Shared by both portals; which sound/channel/label
          // it uses is picked at runtime from the "kind" extra.
          public class RingingService extends Service {
              private static final int NOTIF_ID = 4321;
              // Matches the Cloudflare Worker's NEAREST_TIMEOUT_MS exactly
              // (25s) — past this point the ride/delivery may already have
              // been offered to another driver, so this device's alert
              // should stop on its own even if nobody accepts, rejects, or
              // skips it here. Driver-side ("ride"/"delivery") only — the
              // Worker never reassigns a restaurant's own "order" alert to
              // another restaurant, so there's no matching window to
              // auto-stop against for that kind; it keeps ringing until
              // explicitly accepted/rejected in-app.
              private static final long AUTO_STOP_MS = 25_000;

              private MediaPlayer mediaPlayer;
              private Vibrator vibrator;
              private final Handler timeoutHandler = new Handler(Looper.getMainLooper());
              private Runnable timeoutRunnable;

              // What this service is currently ringing for, if anything —
              // checked by cancelIfMatches() so a stray/late cancel_ring
              // push for an OLD ride/order can never silence a NEW one
              // that happens to already be ringing by the time it arrives.
              private static volatile String currentKind;
              private static volatile String currentId;

              // Called from AlertFcmService when a "cancel_ring" data push
              // arrives. Only stops the service if it's ringing for this
              // exact kind+id right now — a no-op otherwise (e.g. already
              // stopped, already moved on to a different alert, or this
              // cancel arrived for something this device was never
              // ringing for in the first place).
              public static void cancelIfMatches(android.content.Context ctx, String kind, String id) {
                  if (kind == null || id == null) return;
                  if (kind.equals(currentKind) && id.equals(currentId)) {
                      ctx.stopService(new Intent(ctx, RingingService.class));
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String kind = intent.getStringExtra("kind");
                  String id = intent.getStringExtra("id");
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");
                  currentKind = kind;
                  currentId = id;

                  // If a second ride/order/delivery arrives while the first
                  // one is still ringing (unanswered), this service gets
                  // started again — without stopping the previous sound
                  // first, the old and new MediaPlayer would both loop at
                  // once. Always clear out any currently-playing sound and
                  // vibration before starting the new one, so only the
                  // latest alert is ever audible.
                  stopRingLoop();
                  if (timeoutRunnable != null) timeoutHandler.removeCallbacks(timeoutRunnable);

                  startForeground(NOTIF_ID, buildNotification(kind, id, title, body));
                  startRingLoop(kind);

                  boolean isDriverSide = "ride".equals(kind) || "delivery".equals(kind);
                  if (isDriverSide) {
                      timeoutRunnable = this::stopSelf;
                      timeoutHandler.postDelayed(timeoutRunnable, AUTO_STOP_MS);
                  } else {
                      timeoutRunnable = null;
                  }
                  return START_NOT_STICKY;
              }

              private Notification buildNotification(String kind, String id, String title, String body) {
                  String channelId;
                  String channelName;
                  String defaultTitle;
                  if ("ride".equals(kind)) {
                      channelId = "ride_alerts"; channelName = "Ride Alerts"; defaultTitle = "New Ride Request";
                  } else if ("delivery".equals(kind)) {
                      channelId = "delivery_alerts"; channelName = "Delivery Alerts"; defaultTitle = "New Delivery";
                  } else {
                      channelId = "order_ring_alerts"; channelName = "Order Ring Alerts"; defaultTitle = "New Order";
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager.getNotificationChannel(channelId) == null) {
                          NotificationChannel channel = new NotificationChannel(
                              channelId, channelName, NotificationManager.IMPORTANCE_HIGH
                          );
                          channel.setSound(null, null);
                          channel.enableVibration(false);
                          manager.createNotificationChannel(channel);
                      }
                  }

                  Intent fullScreenIntent = new Intent(this, RingingActivity.class);
                  fullScreenIntent.putExtra("kind", kind);
                  fullScreenIntent.putExtra("id", id);
                  fullScreenIntent.putExtra("title", title);
                  fullScreenIntent.putExtra("body", body);
                  fullScreenIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent fullScreenPendingIntent = PendingIntent.getActivity(
                      this, 0, fullScreenIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  return new NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_menu_call)
                      .setContentTitle(title != null ? title : defaultTitle)
                      .setContentText(body != null ? body : "Tap to view")
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setFullScreenIntent(fullScreenPendingIntent, true)
                      .setContentIntent(fullScreenPendingIntent)
                      .setOngoing(true)
                      .setAutoCancel(false)
                      .build();
              }

              private void startRingLoop(String kind) {
                  try {
                      // Delivery reuses the order_alert sound file (same
                      // asset the old system used for delivery jobs) —
                      // ride gets its own ride_alert sound, and so does a
                      // restaurant order.
                      String soundName = "ride".equals(kind) ? "ride_alert" : "order_alert";
                      Uri soundUri = Uri.parse(android.content.ContentResolver.SCHEME_ANDROID_RESOURCE + "://" + getPackageName() + "/raw/" + soundName);
                      mediaPlayer = new MediaPlayer();
                      mediaPlayer.setDataSource(this, soundUri);
                      mediaPlayer.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build());
                      mediaPlayer.setLooping(true);
                      mediaPlayer.prepare();
                      mediaPlayer.start();
                  } catch (Exception ignored) {
                      // If the sound fails to load for any reason, vibration
                      // below still runs — the user still gets alerted.
                  }

                  vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  if (vibrator != null) {
                      long[] pattern = {0, 800, 300, 800, 300, 800, 300, 800};
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                      } else {
                          vibrator.vibrate(pattern, 0);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  stopRingLoop();
                  if (timeoutRunnable != null) {
                      timeoutHandler.removeCallbacks(timeoutRunnable);
                      timeoutRunnable = null;
                  }
                  currentKind = null;
                  currentId = null;
              }

              private void stopRingLoop() {
                  if (mediaPlayer != null) {
                      try { mediaPlayer.stop(); mediaPlayer.release(); } catch (Exception ignored) {}
                      mediaPlayer = null;
                  }
                  if (vibrator != null) {
                      vibrator.cancel();
                      vibrator = null;
                  }
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }

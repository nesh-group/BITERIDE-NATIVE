                  // from driver.html/partner.html's own action handlers)
                  // or RingingService's own 30-second timeout clears the
                  // ringing notification. See RingControlPlugin.java.
              }

              @Override
              public void onPause() {
                  super.onPause();
                  AppState.isForeground = false;
              }

              // If this launch came from the native ringing screen (user
              // tapped Accept/Reject/Open while the app was closed), first
              // navigate the WebView to the right portal page, then forward
              // the action into that page's own JS once it has finished
              // loading. window.handleNativeRideAction (used for both
              // "ride" and "delivery" kinds — driver.html's own
              // handlePopupItemAction already branches on the kind
              // argument) / window.handleNativeOrderAction (used for
              // "order") self-retry until the page's own script is ready,
              // so exact WebView load timing doesn't matter.
              //
              // "kind" is one of "ride" / "delivery" / "order" and comes
              // straight from RingingActivity, which itself derived it from
              // the FCM push's "type" field (new_ride / new_delivery /
              // new_order). The three kinds need different id formats:
              //   ride     -> plain rideId
              //   delivery -> composite "restId::orderId" (that's the exact
              //               format driver.html's handlePopupDeliveryAction
              //               expects — see RingingActivity for where this
              //               composite id gets built)
              //   order    -> plain orderId
              private void handleIncomingIntent(Intent intent) {
                  if (intent == null) return;
                  String kind = intent.getStringExtra("kind");
                  String action = intent.getStringExtra("action");
                  String id = intent.getStringExtra("id");
                  if (kind == null || action == null) return;

                  boolean isDriverSide = "ride".equals(kind) || "delivery".equals(kind);
                  String page = isDriverSide ? "driver.html" : "partner.html";
                  String jsFunction = isDriverSide ? "handleNativeRideAction" : "handleNativeOrderAction";

                  getBridge().getWebView().post(() -> {
                      // A bare filename like "partner.html" gets treated by
                      // WebView.loadUrl() as its own domain (loads
                      // http://partner.html/ and fails with
                      // ERR_CLEARTEXT_NOT_PERMITTED) instead of a path
                      // inside the app. Capacitor serves the app's www/
                      // folder from https://localhost/ by default, so the
                      // full origin has to be included explicitly.
                      getBridge().getWebView().loadUrl("https://localhost/" + page);
                      String js = "(function retry(){"
                          + "if (window." + jsFunction + ") {"
                          + "window." + jsFunction + "("
                          + jsString(action) + "," + jsString(id != null ? id : "") + "," + jsString(kind)
                          + ");"
                          + "} else { setTimeout(retry, 300); } })();";
                      getBridge().getWebView().postDelayed(() ->
                          getBridge().getWebView().evaluateJavascript(js, null), 400);
                  });
              }

              private String jsString(String s) {
                  return "'" + s.replace("\\\\", "\\\\\\\\").replace("'", "\\\\'") + "'";
              }
          }

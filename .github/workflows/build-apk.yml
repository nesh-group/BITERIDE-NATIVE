                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                      KeyguardManager km = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                      if (km != null) km.requestDismissKeyguard(this, null);
                  } else {
                      getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                              | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                              | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                      );
                  }

                  kind = getIntent().getStringExtra("kind");
                  alertId = getIntent().getStringExtra("id");
                  String title = getIntent().getStringExtra("title");
                  String body = getIntent().getStringExtra("body");
                  String defaultTitle = "delivery".equals(kind) ? "New Delivery"
                      : "order".equals(kind) ? "New Order" : "New Ride Request";

                  setContentView(buildLayout(
                      title != null ? title : defaultTitle,
                      body != null ? body : ""
                  ));
              }

              private LinearLayout buildLayout(String title, String body) {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(60, 60, 60, 60);
                  root.setBackgroundColor(Color.parseColor("#1a1a2e"));

                  TextView titleView = new TextView(this);
                  titleView.setText(title);
                  titleView.setTextColor(Color.WHITE);
                  titleView.setTextSize(24);
                  titleView.setGravity(Gravity.CENTER);
                  root.addView(titleView);

                  TextView bodyView = new TextView(this);
                  bodyView.setText(body);
                  bodyView.setTextColor(Color.LTGRAY);
                  bodyView.setTextSize(16);
                  bodyView.setGravity(Gravity.CENTER);
                  bodyView.setPadding(0, 24, 0, 80);
                  root.addView(bodyView);

                  // Single action: open the app. No native Accept, no
                  // native Reject — every decision (accept, reject/skip)
                  // happens inside the app itself via the normal in-app
                  // popup once it's open.
                  Button openBtn = new Button(this);
                  openBtn.setText("OPEN APP");
                  openBtn.setBackgroundColor(Color.parseColor("#22c55e"));
                  openBtn.setTextColor(Color.WHITE);
                  openBtn.setOnClickListener(v -> finishWith("open"));
                  root.addView(openBtn);

                  return root;
              }

              private void finishWith(String action) {
                  // Deliberately NOT stopping RingingService here anymore —
                  // tapping OPEN APP should only open the app, not close the
                  // alert. The sound/vibration/notification keep going until
                  // the person actually accepts or cancels inside
                  // driver.html/partner.html (which calls
                  // RingControl.stopRinging()), or — driver side only — the
                  // service's own 25s AUTO_STOP_MS timeout fires.

                  Intent launch = new Intent(this, MainActivity.class);
                  launch.putExtra("kind", kind);
                  launch.putExtra("action", action);
                  launch.putExtra("id", alertId);
                  launch.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  startActivity(launch);
                  finish();
              }

              @Override
              public void onBackPressed() {
                  // Ignore back button — user must tap one of the buttons,
                  // same as an incoming call screen.
              }
          }
          EOF

      # ---- WHY THIS STEP EXISTS ----
      # Without it, every build used Gradle's DEFAULT debug keystore, which
      # is auto-generated on first use. GitHub Actions gives you a brand new
      # empty machine every run, so a NEW random keystore was generated on
      # every single build. Android refuses to install an APK signed with a
      # different key over an already-installed app with the same package
      # name — so every update forced an uninstall first.
      #
      # Fix: sign every build with the SAME keystore file, stored once as a
      # GitHub secret. To set this up (one-time):
      #   1. On any computer with a JDK installed, run:
      #        keytool -genkeypair -v -keystore nesh-release.keystore \
      #          -alias nesh -keyalg RSA -keysize 2048 -validity 10000
      #      (pick your own passwords; write them down — you cannot recover them)
      #   2. Base64-encode it:
      #        base64 -w0 nesh-release.keystore > keystore.b64   (Linux)
      #        base64 -i nesh-release.keystore -o keystore.b64   (macOS)
      #   3. In your GitHub repo: Settings → Secrets and variables → Actions
      #      → New repository secret. Add these 4 secrets:
      #        ANDROID_KEYSTORE_BASE64   <- contents of keystore.b64
      #        ANDROID_KEYSTORE_PASSWORD <- password you set in step 1
      #        ANDROID_KEY_ALIAS         <- "nesh" (or whatever alias you used)
      #        ANDROID_KEY_PASSWORD      <- key password you set in step 1
      #   4. IMPORTANT: back up nesh-release.keystore somewhere safe (e.g. a
      #      password manager). If you ever lose it, you can NEVER publish an
      #      update to people who already installed the app — they'd have to
      #      uninstall and reinstall fresh, one time, forever after.
      - name: Set up persistent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — falling back to Gradle's throwaway debug keystore. Updates will keep forcing an uninstall until you add the 4 signing secrets (see comments in this workflow)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nesh-release.keystore"
          fi

      - name: Set app version + apply persistent signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          GRADLE="android/app/build.gradle"
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"

          # Every build gets a strictly increasing versionCode (the GitHub
          # Actions run number) so the app can tell "is there something
          # newer than what I have" just by comparing two integers.
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" "$GRADLE" || true
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" "$GRADLE" || true
          if ! grep -q "versionCode" "$GRADLE"; then
            sed -i "/defaultConfig {/a\\        versionCode ${VERSION_CODE}\n        versionName \"${VERSION_NAME}\"" "$GRADLE"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 - "$GRADLE" "$RUNNER_TEMP/nesh-release.keystore" << 'PYEOF'
          import sys, re
          gradle_path, keystore_path = sys.argv[1], sys.argv[2]
          with open(gradle_path) as f:
              content = f.read()
          signing_block = '''
              signingConfigs {
                  nesh {
                      storeFile file("%s")
                      storePassword System.getenv("NESH_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("NESH_KEY_ALIAS")
                      keyPassword System.getenv("NESH_KEY_PASSWORD")
                  }
              }
          ''' % keystore_path.replace("\\", "\\\\")
          content = content.replace("android {", "android {\n" + signing_block, 1)
          # Point both debug and release build types at the same signing
          # config, so the same command (assembleDebug) always produces a
          # consistently-signed, installable-as-an-update APK.
          content = re.sub(
              r"(buildTypes\s*\{)",
              r"\1\n        debug {\n            signingConfig signingConfigs.nesh\n        }\n        release {\n            signingConfig signingConfigs.nesh\n        }",
              content,
              count=1,
          )
          with open(gradle_path, 'w') as f:
              f.write(content)
          PYEOF
          fi

      # ---- Makes the in-app "UPDATE" banner reliable ----
      # The @capacitor/app plugin isn't guaranteed to be registered in
      # every build, so instead of asking the plugin for the running
      # app's version at runtime, we bake the real build number directly
      # into the HTML here, at build time. driver.html and partner.html
      # each start with a placeholder:
      #   <script>window.NESH_BUILD_NUMBER = 0; ...</script>
      # This step replaces the 0 with this run's actual version code.
      - name: Bake build number into driver.html and partner.html
        run: |
          VERSION_CODE="${{ github.run_number }}"
          sed -i "s/window.NESH_BUILD_NUMBER = [0-9]*;/window.NESH_BUILD_NUMBER = ${VERSION_CODE};/" www/driver.html
          sed -i "s/window.NESH_BUILD_NUMBER = [0-9]*;/window.NESH_BUILD_NUMBER = ${VERSION_CODE};/" www/partner.html
          grep -o "NESH_BUILD_NUMBER = [0-9]*" www/driver.html
          grep -o "NESH_BUILD_NUMBER = [0-9]*" www/partner.html

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          NESH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NESH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NESH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleDebug

      # ---- Diagnostic: find the exact <service> Android kills on swipe ----
      # By default a foreground service is stopped the moment its app is
      # swiped away from Recents — that's plain Android behaviour
      # (android:stopWithTask defaults to true), not something OEM battery/
      # autostart settings control. Apps like Swiggy's driver app survive a
      # swipe because their location service is declared with
      # android:stopWithTask="false" in the manifest.
      # @capgo/background-geolocation's own service (inside its AAR) isn't
      # visible in this repo's source AndroidManifest.xml — it only appears
      # after Gradle's manifest merger runs during the build above. This
      # step greps the merged manifest Gradle already produced and prints
      # every <service> with foregroundServiceType="location", so the exact
      # android:name can be read straight from the build log instead of
      # guessed. Once we have that name, a matching <service ... tools:node
      # ="merge" android:stopWithTask="false" /> entry can be added to this
      # app's own AndroidManifest.xml (in the step above) to override it.
      - name: Print merged manifest's location service (for stopWithTask fix)
        working-directory: android
        run: |
          MERGED=$(find app/build/intermediates -iname "AndroidManifest.xml" -path "*merged_manifest*" -o -iname "AndroidManifest.xml" -path "*merged_manifests*" 2>/dev/null | head -1)
          if [ -z "$MERGED" ]; then
            echo "Could not locate the merged manifest under app/build/intermediates — listing what's there instead:"
            find app/build/intermediates -iname "AndroidManifest.xml" 2>/dev/null
          else
            echo "Merged manifest: $MERGED"
            echo "---- <service> entries with foregroundServiceType=\"location\" ----"
            grep -B2 -A6 'foregroundServiceType="location"' "$MERGED" || echo "(none found — plugin may declare it without this attribute; showing all <service> entries instead)"
            grep -B2 -A6 '<service' "$MERGED"
          fi

      - name: Upload the built APK (for you to download from the Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: nesh-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---- Publishes the APK somewhere phones can download it from ----
      # This is what makes the in-app "UPDATE" banner (added to
      # index.html/driver.html/partner.html) work: it points people at this
      # release's APK URL. Every push to main creates a new tagged release.
      - name: Publish APK to a GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      # ---- Tells the app in people's pockets that an update exists ----
      # Writes { build, name, apkUrl } to appConfig/latestVersion in your
      # Firebase Realtime Database. The auto-update banner reads this path.
      # Needs a FIREBASE_DB_URL secret, e.g.
      #   https://your-project-id-default-rtdb.firebaseio.com
      # This only works if your Database Rules allow writes to
      # "appConfig" — if they don't, either open that one path up for
      # writes, or add a FIREBASE_DB_AUTH secret (a database secret / ID
      # token) and append `&auth=$FIREBASE_DB_AUTH` to the URL below.
      - name: Announce the new version to the app (Firebase)
        env:
          DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          APK_URL: ${{ steps.release.outputs.url }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "FIREBASE_DB_URL secret not set — skipping. The in-app update banner won't know about this build until you add that secret."
            exit 0
          fi
          ASSET_URL=$(echo "$APK_URL" | sed 's#/tag/#/download/#')/app-debug.apk
          curl -s -X PUT -d "{\"build\": ${{ github.run_number }}, \"name\": \"1.0.${{ github.run_number }}\", \"apkUrl\": \"$ASSET_URL\"}" \
            "${DB_URL}/appConfig/latestVersion.json"

                  TextView header = new TextView(this);
                  header.setText(headerText);
                  header.setTextColor(Color.WHITE);
                  header.setTextSize(24);
                  header.setTypeface(null, android.graphics.Typeface.BOLD);
                  header.setGravity(Gravity.CENTER);
                  header.setBackgroundColor(GREEN);
                  header.setPadding(dp(20), dp(18), dp(20), dp(18));
                  root.addView(header, new LinearLayout.LayoutParams(MATCH, WRAP));

                  LinearLayout center = new LinearLayout(this);
                  center.setOrientation(LinearLayout.VERTICAL);
                  center.setGravity(Gravity.CENTER);
                  center.setPadding(dp(22), dp(22), dp(22), dp(22));
                  root.addView(center, new LinearLayout.LayoutParams(MATCH, 0, 1f));

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackground(rounded(SOFT_GREEN, 20, LINE_GREEN));
                  card.setPadding(dp(22), dp(22), dp(22), dp(22));
                  center.addView(card, new LinearLayout.LayoutParams(MATCH, WRAP));

                  TextView titleView = new TextView(this);
                  titleView.setText(cardTitle);
                  titleView.setTextColor(DARK_GREEN);
                  titleView.setTextSize(22);
                  titleView.setTypeface(null, android.graphics.Typeface.BOLD);
                  card.addView(titleView, new LinearLayout.LayoutParams(MATCH, WRAP));

                  View line = new View(this);
                  line.setBackgroundColor(LINE_GREEN);
                  LinearLayout.LayoutParams lineLp = new LinearLayout.LayoutParams(MATCH, dp(1));
                  lineLp.setMargins(0, dp(14), 0, dp(10));
                  card.addView(line, lineLp);

                  // body arrives as "items . Total: Rs.. . customer" -> one tidy line each
                  for (String part : body.split(" \u00b7 ")) {
                      if (part.trim().isEmpty()) continue;
                      TextView t = new TextView(this);
                      t.setText(part.trim());
                      t.setTextColor(Color.parseColor("#1f2937"));
                      t.setTextSize(17);
                      t.setTypeface(null, android.graphics.Typeface.BOLD);
                      t.setPadding(0, dp(4), 0, dp(4));
                      card.addView(t, new LinearLayout.LayoutParams(MATCH, WRAP));
                  }

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.VERTICAL);
                  buttons.setPadding(dp(22), 0, dp(22), dp(28));
                  root.addView(buttons, new LinearLayout.LayoutParams(MATCH, WRAP));

                  Button openBtn = new Button(this);
                  openBtn.setText("OPEN APP");
                  openBtn.setTextColor(Color.WHITE);
                  openBtn.setTextSize(16);
                  openBtn.setTypeface(null, android.graphics.Typeface.BOLD);
                  openBtn.setBackground(rounded(GREEN, 14, 0));
                  openBtn.setOnClickListener(v -> finishWith("open"));
                  LinearLayout.LayoutParams openLp = new LinearLayout.LayoutParams(MATCH, dp(54));
                  buttons.addView(openBtn, openLp);

                  Button dismissBtn = new Button(this);
                  dismissBtn.setText("DISMISS");
                  dismissBtn.setTextColor(GREEN);
                  dismissBtn.setTextSize(15);
                  dismissBtn.setBackground(rounded(Color.WHITE, 14, GREEN));
                  dismissBtn.setOnClickListener(v -> finishWith("dismiss"));
                  LinearLayout.LayoutParams disLp = new LinearLayout.LayoutParams(MATCH, dp(50));
                  disLp.setMargins(0, dp(12), 0, 0);
                  buttons.addView(dismissBtn, disLp);

                  return root;
              }

              private void finishWith(String action) {
                  // Operator alert: just open the app (no portal/action forwarding)
                  // and clear the silent notification.
                  if ("operator".equals(kind)) {
                      stopService(new Intent(this, RingingService.class));
                      if (!"dismiss".equals(action)) {
                          Intent open = new Intent(this, MainActivity.class);
                          open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          startActivity(open);
                      }
                      finish();
                      return;
                  }
                  // Deliberately NOT stopping RingingService here anymore —
                  // tapping OPEN APP should only open the app, not close the
                  // alert. The sound/vibration/notification keep going until
                  // the person actually accepts or cancels inside
                  // driver.html/partner.html (which calls
                  // RingControl.stopRinging()), or — driver side only — the
                  // service's own 25s AUTO_STOP_MS timeout fires.

                  Intent launch = new Intent(this, MainActivity.class);
                  launch.putExtra("kind", kind);
                  launch.putExtra("action", action);
                  launch.putExtra("id", alertId);
                  launch.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  startActivity(launch);
                  finish();
              }

              @Override
              public void onBackPressed() {
                  // Ignore back button — user must tap one of the buttons,
                  // same as an incoming call screen.
              }
          }
          EOF

      # ---- WHY THIS STEP EXISTS ----
      # Without it, every build used Gradle's DEFAULT debug keystore, which
      # is auto-generated on first use. GitHub Actions gives you a brand new
      # empty machine every run, so a NEW random keystore was generated on
      # every single build. Android refuses to install an APK signed with a
      # different key over an already-installed app with the same package
      # name — so every update forced an uninstall first.
      #
      # Fix: sign every build with the SAME keystore file, stored once as a
      # GitHub secret. To set this up (one-time):
      #   1. On any computer with a JDK installed, run:
      #        keytool -genkeypair -v -keystore nesh-release.keystore \
      #          -alias nesh -keyalg RSA -keysize 2048 -validity 10000
      #      (pick your own passwords; write them down — you cannot recover them)
      #   2. Base64-encode it:
      #        base64 -w0 nesh-release.keystore > keystore.b64   (Linux)
      #        base64 -i nesh-release.keystore -o keystore.b64   (macOS)
      #   3. In your GitHub repo: Settings → Secrets and variables → Actions
      #      → New repository secret. Add these 4 secrets:
      #        ANDROID_KEYSTORE_BASE64   <- contents of keystore.b64
      #        ANDROID_KEYSTORE_PASSWORD <- password you set in step 1
      #        ANDROID_KEY_ALIAS         <- "nesh" (or whatever alias you used)
      #        ANDROID_KEY_PASSWORD      <- key password you set in step 1
      #   4. IMPORTANT: back up nesh-release.keystore somewhere safe (e.g. a
      #      password manager). If you ever lose it, you can NEVER publish an
      #      update to people who already installed the app — they'd have to
      #      uninstall and reinstall fresh, one time, forever after.
      - name: Set up persistent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — falling back to Gradle's throwaway debug keystore. Updates will keep forcing an uninstall until you add the 4 signing secrets (see comments in this workflow)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nesh-release.keystore"
          fi

      - name: Set app version + apply persistent signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          GRADLE="android/app/build.gradle"
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"

          # Every build gets a strictly increasing versionCode (the GitHub
          # Actions run number) so the app can tell "is there something
          # newer than what I have" just by comparing two integers.
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" "$GRADLE" || true
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" "$GRADLE" || true
          if ! grep -q "versionCode" "$GRADLE"; then
            sed -i "/defaultConfig {/a\\        versionCode ${VERSION_CODE}\n        versionName \"${VERSION_NAME}\"" "$GRADLE"
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 - "$GRADLE" "$RUNNER_TEMP/nesh-release.keystore" << 'PYEOF'
          import sys, re
          gradle_path, keystore_path = sys.argv[1], sys.argv[2]
          with open(gradle_path) as f:
              content = f.read()
          signing_block = '''
              signingConfigs {
                  nesh {
                      storeFile file("%s")
                      storePassword System.getenv("NESH_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("NESH_KEY_ALIAS")
                      keyPassword System.getenv("NESH_KEY_PASSWORD")
                  }
              }
          ''' % keystore_path.replace("\\", "\\\\")
          content = content.replace("android {", "android {\n" + signing_block, 1)
          # Point both debug and release build types at the same signing
          # config, so the same command (assembleDebug) always produces a
          # consistently-signed, installable-as-an-update APK.
          content = re.sub(
              r"(buildTypes\s*\{)",
              r"\1\n        debug {\n            signingConfig signingConfigs.nesh\n        }\n        release {\n            signingConfig signingConfigs.nesh\n        }",
              content,
              count=1,
          )
          with open(gradle_path, 'w') as f:
              f.write(content)
          PYEOF
          fi

      # Resolve independent portal build counters BEFORE baking them into the HTML.
      # The Android package still has one global versionCode, but Driver and Partner
      # each carry their own in-app build number so only the selected portal prompts.
      - name: Resolve app-specific update counters
        id: app_versions
        env:
          DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          TARGET_INPUT: ${{ github.event.inputs.update_for }}
          FORCE_DRIVER_INPUT: ${{ github.event.inputs.force_driver_update }}
          FORCE_PARTNER_INPUT: ${{ github.event.inputs.force_partner_update }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          TARGET=all
          if [ -n "$TARGET_INPUT" ]; then TARGET="$TARGET_INPUT"; fi
          DRV_TAG=false; PAR_TAG=false
          if echo "$COMMIT_MSG" | grep -qi '\[driver-only\]'; then DRV_TAG=true; fi
          if echo "$COMMIT_MSG" | grep -qi '\[partner-only\]'; then PAR_TAG=true; fi
          if [ "$DRV_TAG" = "true" ] && [ "$PAR_TAG" = "false" ]; then TARGET=driver; fi
          if [ "$PAR_TAG" = "true" ] && [ "$DRV_TAG" = "false" ]; then TARGET=partner; fi

          FORCE_DRIVER=false; FORCE_PARTNER=false
          if [ "$FORCE_DRIVER_INPUT" = "true" ] || echo "$COMMIT_MSG" | grep -qi '\[force-driver\]'; then FORCE_DRIVER=true; fi
          if [ "$FORCE_PARTNER_INPUT" = "true" ] || echo "$COMMIT_MSG" | grep -qi '\[force-partner\]'; then FORCE_PARTNER=true; fi
          # A force flag only applies when this run actually targets that app.
          if [ "$TARGET" != "all" ] && [ "$TARGET" != "driver" ]; then FORCE_DRIVER=false; fi
          if [ "$TARGET" != "all" ] && [ "$TARGET" != "partner" ]; then FORCE_PARTNER=false; fi

          # Safety: a forced update shows a blocking screen the user cannot leave.
          # Without the persistent signing keystore the new APK cannot install over
          # the old one, and without FIREBASE_DB_URL the prompt is never announced,
          # so refuse to build a forced update in either case.
          if [ "$FORCE_DRIVER" = "true" ] || [ "$FORCE_PARTNER" = "true" ]; then
            if [ -z "$KEYSTORE_BASE64" ]; then
              echo "::error::Forced update requested but ANDROID_KEYSTORE_BASE64 is not set. The APK would be signed with a throwaway key and could not install over the installed app, locking users on the blocking screen."
              exit 1
            fi
            if [ -z "$DB_URL" ]; then
              echo "::error::Forced update requested but FIREBASE_DB_URL is not set, so the update could never be announced."
              exit 1
            fi
          fi

          if [ -n "$DB_URL" ]; then
            curl -fsS "${DB_URL}/appConfig/latestVersion.json" -o prev.json || { echo "Could not read Firebase appConfig/latestVersion; refusing to guess the other portal's build counter."; exit 1; }
          else
            printf '{"build":%s,"driverBuild":%s,"partnerBuild":%s}' "$RUN_NUMBER" "$RUN_NUMBER" "$RUN_NUMBER" > prev.json
            echo "FIREBASE_DB_URL not set: using this run number as the baseline for both portals; Firebase announcements will be skipped."
          fi

          TARGET="$TARGET" FORCE_DRIVER="$FORCE_DRIVER" FORCE_PARTNER="$FORCE_PARTNER" RUN_NUMBER="$RUN_NUMBER" python3 - <<'PYEOF'
          import json, os
          try:
              prev=json.load(open('prev.json')) or {}
          except Exception:
              prev={}
          if not isinstance(prev, dict): prev={}
          def num(k, default=0):
              try: return int(prev.get(k, default) or 0)
              except Exception: return default
          run=int(os.environ['RUN_NUMBER'])
          target=os.environ['TARGET']
          driver=num('driverBuild', num('build', 0))
          partner=num('partnerBuild', num('build', 0))
          force_driver=num('forceDriverBuild', 0)
          force_partner=num('forcePartnerBuild', 0)
          if target in ('all','driver'):
              driver=run
              if os.environ['FORCE_DRIVER']=='true': force_driver=run
          if target in ('all','partner'):
              partner=run
              if os.environ['FORCE_PARTNER']=='true': force_partner=run
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'driver_build={driver}\n')
              out.write(f'partner_build={partner}\n')
              out.write(f'target={target}\n')
              out.write(f'force_driver={str(os.environ["FORCE_DRIVER"]=="true").lower()}\n')
              out.write(f'force_partner={str(os.environ["FORCE_PARTNER"]=="true").lower()}\n')
          print(f'Target={target}; Driver build={driver}; Partner build={partner}; Force Driver={force_driver}; Force Partner={force_partner}')
          PYEOF

      # Each HTML portal compares its own baked counter with its own Firebase field.
      - name: Bake separate Driver and Partner build numbers
        env:
          DRIVER_BUILD: ${{ steps.app_versions.outputs.driver_build }}
          PARTNER_BUILD: ${{ steps.app_versions.outputs.partner_build }}
        run: |
          sed -i "s/window.NESH_BUILD_NUMBER = [0-9]*;/window.NESH_BUILD_NUMBER = ${DRIVER_BUILD};/" www/driver.html
          sed -i "s/window.NESH_BUILD_NUMBER = [0-9]*;/window.NESH_BUILD_NUMBER = ${PARTNER_BUILD};/" www/partner.html
          grep -q "window.NESH_BUILD_NUMBER = ${DRIVER_BUILD};" www/driver.html || { echo "::error::Could not bake build number into www/driver.html"; exit 1; }
          grep -q "window.NESH_BUILD_NUMBER = ${PARTNER_BUILD};" www/partner.html || { echo "::error::Could not bake build number into www/partner.html"; exit 1; }
          echo "Driver HTML:"; grep -o "NESH_BUILD_NUMBER = [0-9]*" www/driver.html
          echo "Partner HTML:"; grep -o "NESH_BUILD_NUMBER = [0-9]*" www/partner.html

      - name: Add OTA helper script to every page
        run: node dp-ota-inject.js www

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          NESH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NESH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NESH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleDebug

      # ---- Diagnostic: find the exact <service> Android kills on swipe ----
      # By default a foreground service is stopped the moment its app is
      # swiped away from Recents — that's plain Android behaviour
      # (android:stopWithTask defaults to true), not something OEM battery/
      # autostart settings control. Apps like Swiggy's driver app survive a
      # swipe because their location service is declared with
      # android:stopWithTask="false" in the manifest.
      # @capgo/background-geolocation's own service (inside its AAR) isn't
      # visible in this repo's source AndroidManifest.xml — it only appears
      # after Gradle's manifest merger runs during the build above. This
      # step greps the merged manifest Gradle already produced and prints
      # every <service> with foregroundServiceType="location", so the exact
      # android:name can be read straight from the build log instead of
      # guessed. Once we have that name, a matching <service ... tools:node
      # ="merge" android:stopWithTask="false" /> entry can be added to this
      # app's own AndroidManifest.xml (in the step above) to override it.
      - name: Print merged manifest's location service (for stopWithTask fix)
        working-directory: android
        run: |
          MERGED=$(find app/build/intermediates -iname "AndroidManifest.xml" -path "*merged_manifest*" -o -iname "AndroidManifest.xml" -path "*merged_manifests*" 2>/dev/null | head -1)
          if [ -z "$MERGED" ]; then
            echo "Could not locate the merged manifest under app/build/intermediates — listing what's there instead:"
            find app/build/intermediates -iname "AndroidManifest.xml" 2>/dev/null
          else
            echo "Merged manifest: $MERGED"
            echo "---- <service> entries with foregroundServiceType=\"location\" ----"
            grep -B2 -A6 'foregroundServiceType="location"' "$MERGED" || echo "(none found — plugin may declare it without this attribute; showing all <service> entries instead)"
            grep -B2 -A6 '<service' "$MERGED"
          fi

      - name: Upload the built APK (for you to download from the Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: nesh-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---- Publishes the APK somewhere phones can download it from ----
      # This is what makes the in-app "UPDATE" banner (added to
      # index.html/driver.html/partner.html) work: it points people at this
      # release's APK URL. Every push to main creates a new tagged release.
      - name: Publish APK to a GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

      # ---- Tells the app in people's pockets that an update exists ----
      # Writes { build, name, apkUrl } to appConfig/latestVersion in your
      # Firebase Realtime Database. The auto-update banner reads this path.
      # Needs a FIREBASE_DB_URL secret, e.g.
      #   https://your-project-id-default-rtdb.firebaseio.com
      # This only works if your Database Rules allow writes to
      # "appConfig" — if they don't, either open that one path up for
      # writes, or add a FIREBASE_DB_AUTH secret (a database secret / ID
      # token) and append `&auth=$FIREBASE_DB_AUTH` to the URL below.
      - name: Announce app-specific versions to Firebase
        env:
          DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          APK_URL: ${{ steps.release.outputs.url }}
          DRIVER_BUILD: ${{ steps.app_versions.outputs.driver_build }}
          PARTNER_BUILD: ${{ steps.app_versions.outputs.partner_build }}
          FORCE_DRIVER: ${{ steps.app_versions.outputs.force_driver }}
          FORCE_PARTNER: ${{ steps.app_versions.outputs.force_partner }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::FIREBASE_DB_URL secret not set - build completed, but update announcements were skipped."
            exit 0
          fi
          ASSET_URL="$(echo "$APK_URL" | sed 's#/tag/#/download/#')/app-debug.apk"
          export ASSET_URL
          python3 - <<'PYEOF' > payload.json
          import json, os
          e = os.environ
          p = {
              "build": int(e["RUN_NUMBER"]),
              "name": "1.0." + e["RUN_NUMBER"],
              "apkUrl": e["ASSET_URL"],
              "driverBuild": int(e["DRIVER_BUILD"]),
              "partnerBuild": int(e["PARTNER_BUILD"]),
          }
          # Force markers are only written when this run forces that app; otherwise
          # they are left untouched in Firebase (PATCH), so an earlier force or an
          # operator-panel setting is never wiped by a normal build.
          if e["FORCE_DRIVER"] == "true": p["forceDriverBuild"] = int(e["RUN_NUMBER"])
          if e["FORCE_PARTNER"] == "true": p["forcePartnerBuild"] = int(e["RUN_NUMBER"])
          print(json.dumps(p))
          PYEOF
          cat payload.json
          curl -fsS -X PATCH -H 'Content-Type: application/json' -d @payload.json "${DB_URL}/appConfig/latestVersion.json"

              // A push can arrive late (FCM delay, or the Worker's escalation racing with another driver's accept) for a
              // job that is already taken / cancelled. One tiny check when the popup opens: if the job is gone, stop the
              // ring and close the popup, so the driver never sees a dead request. If the check itself fails (no network)
              // the popup simply stays - Accept still re-checks atomically.
              private void verifyStillOpen() {
                  final Context app = getApplicationContext();
                  final String k = kind;
                  final String id = alertId;
                  new Thread(new Runnable() {
                      @Override public void run() {
                          if (!isJobGone(app, k, id)) return;
                          handler.post(new Runnable() {
                              @Override public void run() {
                                  if (decided || id == null || !id.equals(alertId)) return;
                                  stopRing();
                                  closeQuietly();
                              }
                          });
                      }
                  }).start();
              }

              private static boolean isJobGone(Context ctx, String kind, String id) {
                  try {
                      if (id == null || id.isEmpty()) return false;
                      if ("delivery".equals(kind)) {
                          String[] parts = id.split("::", 2);
                          if (parts.length < 2) return false;
                          String base = DB_URL + "/restaurants/" + enc(parts[0]) + "/orders/" + enc(parts[1]);
                          String st = httpGet(base + "/status.json");
                          String dd = httpGet(base + "/deliveryDriverId.json");
                          if (st == null || dd == null) return false;   // no answer -> keep the popup
                          String s = unquote(st);
                          if (!(s.equals("preparing") || s.equals("ready"))) return true;
                          String d = unquote(dd);
                          return !(d.isEmpty() || d.equals("null"));
                      }
                      String st = httpGet(DB_URL + "/rides/" + enc(id) + "/status.json");
                      if (st == null) return false;
                      return !"searching".equals(unquote(st));
                  } catch (Exception e) {
                      return false;
                  }
              }


              private static final int ACCEPT_OK = 0;
              private static final int ACCEPT_TAKEN = 1;
              private static final int ACCEPT_FALLBACK = 2;
              private static final String WORKER_URL = "https://broad-paper-6445.raise3715.workers.dev";

              // Accept done natively (Firebase REST) - the WebView is NOT needed. Same atomic claim as driver.html's
              // handlePopupRideAction / handlePopupDeliveryAction. Anything unexpected (no saved profile, offline,
              // permission denied) falls back to the old path: open the app and let driver.html accept.
              private void onAccept() {
                  if (decided) return;
                  decided = true;
                  acceptBtn.setEnabled(false);
                  skipBtn.setEnabled(false);
                  acceptBtn.setText("Accepting...");
                  stopRing();
                  final Context app = getApplicationContext();
                  final String k = kind;
                  final String id = alertId;
                  final String pl = payloadStr;
                  new Thread(new Runnable() {
                      @Override public void run() {
                          final JSONObject[] won = new JSONObject[1];
                          final int result = nativeAccept(app, k, id, won);
                          handler.post(new Runnable() {
                              @Override public void run() { onAcceptResult(app, result, k, id, pl); }
                          });
                          if (result == ACCEPT_OK && won[0] != null) afterAccept(app, k, id, won[0]);
                      }
                  }).start();
              }

              private void onAcceptResult(Context app, int result, String k, String id, String pl) {
                  if (result == ACCEPT_OK) {
                      launchApp(app, k, id, pl, "accepted");
                      closeQuietly();
                  } else if (result == ACCEPT_TAKEN) {
                      if (acceptBtn != null) acceptBtn.setText("No longer available");
                      handler.postDelayed(new Runnable() {
                          @Override public void run() { closeQuietly(); }
                      }, 1800L);
                  } else {
                      launchApp(app, k, id, pl, "accept");
                      closeQuietly();
                  }
              }

              private static void launchApp(Context ctx, String kind, String id, String payload, String action) {
                  try {
                      Intent i = new Intent(ctx, MainActivity.class);
                      i.putExtra("kind", kind);
                      i.putExtra("action", action);
                      i.putExtra("id", id);
                      i.putExtra("lockscreen", true);
                      if (payload != null) i.putExtra("payload", payload);
                      i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      ctx.startActivity(i);
                  } catch (Exception ignored) {}
              }

              private void onSkip() {
                  if (decided) return;
                  decided = true;
                  final Context app = getApplicationContext();
                  final String k = kind;
                  final String id = alertId;
                  try {
                      app.getSharedPreferences(SKIP_PREFS, 0).edit().putLong(id, System.currentTimeMillis()).apply();
                  } catch (Exception ignored) {}
                  new Thread(new Runnable() {
                      @Override public void run() { releaseRouting(app, k, id); }
                  }).start();
                  stopRing();
                  closeQuietly();
              }

              // Same Firebase fields driver.html clears when the driver skips a job that was routed to them.
              // A plain broadcast job needs no write. Failures are silent: the Worker's own timers still
              // move the job on, exactly as when a driver simply ignores it.
              private static void releaseRouting(Context ctx, String kind, String id) {
                  try {
                      SharedPreferences tp = ctx.getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0);
                      String me = tp.getString(DriverTrackingPlugin.KEY_USERNAME, "");
                      if (me == null || me.isEmpty() || id == null || id.isEmpty()) return;
                      if ("delivery".equals(kind)) {
                          String[] parts = id.split("::", 2);
                          if (parts.length < 2) return;
                          String base = DB_URL + "/restaurants/" + enc(parts[0]) + "/orders/" + enc(parts[1]);
                          String cur = unquote(httpGet(base + "/assignedDriverId.json"));
                          if (me.equals(cur)) httpPut(base + "/assignedDriverId.json", "null");
                          return;
                      }
                      String base = DB_URL + "/rides/" + enc(id);
                      String json = httpGet(base + ".json");
                      if (json == null || json.trim().equals("null")) return;
                      JSONObject r = new JSONObject(json);
                      if (me.equals(r.optString("assignedDriverId", ""))) {
                          httpPut(base + "/assignedDriverId.json", "null");
                          httpPut(base + "/declinedDriverIds/" + enc(me) + ".json", "true");
                      }
                      if (me.equals(r.optString("candidateDriverId", ""))) {
                          httpPut(base + "/candidateDriverId.json", "null");
                          httpPut(base + "/declinedDriverIds/" + enc(me) + ".json", "true");
                      }
                      if (me.equals(r.optString("chosenDriverId", ""))) {
                          httpPut(base + "/chosenDriverId.json", "null");
                          httpPut(base + "/chosenDriverStatus.json", "\"declined\"");
                      }
                  } catch (Exception ignored) {}
              }

              private static String unquote(String s) {
                  if (s == null) return "";
                  String v = s.trim();
                  if (v.length() >= 2 && v.startsWith("\"") && v.endsWith("\"")) v = v.substring(1, v.length() - 1);
                  return v;
              }

              private static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8").replace("+", "%20"); } catch (Exception e) { return s; }
              }

              private static String httpGet(String url) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod("GET");
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      if (c.getResponseCode() != 200) return null;
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[1024];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      return out.toString("UTF-8");
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              private static String dayKey(long t) {
                  java.util.Calendar c = java.util.Calendar.getInstance();
                  c.setTimeInMillis(t);
                  return String.format(java.util.Locale.US, "%04d-%02d-%02d",
                      c.get(java.util.Calendar.YEAR), c.get(java.util.Calendar.MONTH) + 1, c.get(java.util.Calendar.DAY_OF_MONTH));
              }

              private static String firstNonEmpty(String a, String b, String c) {
                  if (a != null && !a.isEmpty()) return a;
                  if (b != null && !b.isEmpty()) return b;
                  return c == null ? "" : c;
              }

              // Atomic claim: GET with ETag, check the same conditions as driver.html, PUT with if-match.
              // HTTP 412 = another driver (or the shop/customer app) changed the node first -> re-read and re-check,
              // exactly like a Firebase transaction retry. Whoever's PUT lands first wins; everyone else sees the new
              // status and gets TAKEN.
              private static int nativeAccept(Context ctx, String kind, String id, JSONObject[] wonOut) {
                  try {
                      SharedPreferences tp = ctx.getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0);
                      String me = tp.getString(DriverTrackingPlugin.KEY_USERNAME, "");
                      String name = tp.getString(DriverTrackingPlugin.KEY_DRIVER_NAME, "");
                      String phone = tp.getString(DriverTrackingPlugin.KEY_DRIVER_PHONE, "");
                      String vehicle = tp.getString(DriverTrackingPlugin.KEY_DRIVER_VEHICLE, "");
                      if (!tp.getBoolean(DriverTrackingPlugin.KEY_ONLINE, false)) return ACCEPT_FALLBACK;
                      if (me == null || me.isEmpty() || name == null || name.isEmpty() || id == null || id.isEmpty()) return ACCEPT_FALLBACK;
                      boolean delivery = "delivery".equals(kind);
                      String nodeUrl;
                      if (delivery) {
                          String[] parts = id.split("::", 2);
                          if (parts.length < 2) return ACCEPT_FALLBACK;
                          nodeUrl = DB_URL + "/restaurants/" + enc(parts[0]) + "/orders/" + enc(parts[1]) + ".json";
                      } else {
                          nodeUrl = DB_URL + "/rides/" + enc(id) + ".json";
                      }
                      final long t0 = System.currentTimeMillis();
                      for (int attempt = 0; attempt < 5; attempt++) {
                          if (System.currentTimeMillis() - t0 > 12000L) return ACCEPT_FALLBACK;
                          String[] got = httpGetEtag(nodeUrl);
                          if (got == null) return ACCEPT_FALLBACK;
                          String body = got[1] == null ? "" : got[1].trim();
                          if (body.equals("null")) return ACCEPT_TAKEN;
                          JSONObject cur = new JSONObject(body);
                          if (delivery) {
                              String st = cur.optString("status", "");
                              if (!(st.equals("preparing") || st.equals("ready"))) return ACCEPT_TAKEN;
                              if (cur.optString("deliveryDriverId", "").length() > 0) return ACCEPT_TAKEN;
                              String forced = cur.optString("assignedDriverId", "");
                              if (forced.length() > 0 && !forced.equals(me)) return ACCEPT_TAKEN;
                              cur.put("deliveryDriverId", me);
                              cur.put("deliveryDriverName", name);
                              cur.put("deliveryDriverPhone", phone);
                          } else {
                              if (!"searching".equals(cur.optString("status", ""))) return ACCEPT_TAKEN;
                              String forced = firstNonEmpty(cur.optString("assignedDriverId", ""),
                                  cur.optString("candidateDriverId", ""), cur.optString("chosenDriverId", ""));
                              if (forced.length() > 0 && !forced.equals(me)) return ACCEPT_TAKEN;
                              cur.put("status", "accepted");
                              cur.put("driverId", me);
                              cur.put("driverName", name);
                              cur.put("driverPhone", phone);
                              cur.put("driverVehicleNumber", vehicle);
                          }
                          int code = httpPutCond(nodeUrl, cur.toString(), got[0]);
                          if (code == 200) { wonOut[0] = cur; return ACCEPT_OK; }
                          if (code == -1) {
                              // Unknown outcome (timeout / dropped connection): check whether our write actually landed.
                              String chk = httpGet(nodeUrl);
                              if (chk != null && !chk.trim().equals("null")) {
                                  JSONObject now = new JSONObject(chk.trim());
                                  boolean mine = delivery ? me.equals(now.optString("deliveryDriverId", ""))
                                      : ("accepted".equals(now.optString("status", "")) && me.equals(now.optString("driverId", "")));
                                  if (mine) { wonOut[0] = now; return ACCEPT_OK; }
                              }
                              return ACCEPT_FALLBACK;
                          }
                          if (code != 412) return ACCEPT_FALLBACK;   // 401/403 (rules) etc.
                      }
                      return ACCEPT_FALLBACK;
                  } catch (Exception e) {
                      return ACCEPT_FALLBACK;
                  }
              }

              // Side effects of a won accept - same as driver.html (all best-effort, the accept itself is already done).
              private static void afterAccept(Context ctx, String kind, String id, JSONObject node) {
                  try {
                      SharedPreferences tp = ctx.getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0);
                      String me = tp.getString(DriverTrackingPlugin.KEY_USERNAME, "");
                      String name = tp.getString(DriverTrackingPlugin.KEY_DRIVER_NAME, "");
                      boolean delivery = "delivery".equals(kind);
                      long created = node.optLong("createdAt", 0L);
                      if (created <= 0) created = System.currentTimeMillis();
                      String day = dayKey(created);
                      String base;
                      String daysUrl;
                      if (delivery) {
                          String[] parts = id.split("::", 2);
                          base = DB_URL + "/restaurants/" + enc(parts[0]) + "/orders/" + enc(parts[1]);
                          daysUrl = DB_URL + "/driver_delivery_days/" + enc(me) + "/" + day + "/" + enc(id) + ".json";
                      } else {
                          base = DB_URL + "/rides/" + enc(id);
                          daysUrl = DB_URL + "/driver_days/" + enc(me) + "/" + day + "/" + enc(id) + ".json";
                      }
                      // Job is taken: stop the ring + close the popup on every OTHER driver's phone that was notified
                      // (the Worker looks them up). Best-effort; the winner's own ring is already stopped.
                      try {
                          JSONObject cr = new JSONObject();
                          cr.put("type", "cancel_ring");
                          cr.put("kind", kind);
                          if (delivery) {
                              String[] cp = id.split("::", 2);
                              cr.put("restId", cp[0]);
                              cr.put("orderId", cp[1]);
                          } else {
                              cr.put("rideId", id);
                          }
                          httpPostJson(WORKER_URL, cr.toString());
                      } catch (Exception ignored) {}

                      httpPut(daysUrl, "true");   // per-day index the app uses for Earnings / own deliveries
            httpPut(DB_URL + "/taxi_drivers/" + enc(me) + "/isBusy.json", "true");   // same flag driver.html syncs while on a job

                      // Tell the customer who is coming (same Worker call as driver.html).
                      JSONObject push = new JSONObject();
                      push.put("type", "customer");
                      push.put("title", "Driver assigned!");
                      String to;
                      if (delivery) {
                          to = node.optString("customerAccount", "");
                          if (to.isEmpty()) to = node.optString("customerPhone", "");
                          push.put("body", name + " is picking up your order.");
                          String[] parts = id.split("::", 2);
                          push.put("orderId", parts[1]);
                          push.put("restId", parts[0]);
                      } else {
                          to = node.optString("customerNumber", "");
                          push.put("body", name + " is on the way to pick you up.");
                      }
                      if (!to.isEmpty()) {
                          push.put("customerPhone", to);
                          httpPostJson(WORKER_URL, push.toString());
                      }

                      bumpDailyCount(base + "/driverCounted.json", me);
                  } catch (Exception ignored) {}
              }

              // +1 on taxi_drivers/{me}/rideCountToday exactly once per job (guard flag on the job itself, shared with
              // index.html / driver.html so a job is never counted twice).
              private static void bumpDailyCount(String guardUrl, String me) {
                  try {
                      String[] g = httpGetEtag(guardUrl);
                      if (g == null || g[1] == null || !g[1].trim().equals("null")) return;
                      if (httpPutCond(guardUrl, "true", g[0]) != 200) return;
                      String cu = DB_URL + "/taxi_drivers/" + enc(me) + "/rideCountToday.json";
                      String today = dayKey(System.currentTimeMillis());
                      for (int i = 0; i < 4; i++) {
                          String[] c = httpGetEtag(cu);
                          if (c == null) return;
                          long count = 1;
                          String b = c[1] == null ? "null" : c[1].trim();
                          if (!b.equals("null")) {
                              JSONObject o = new JSONObject(b);
                              if (today.equals(o.optString("date", ""))) count = o.optLong("count", 0L) + 1;
                          }
                          JSONObject n = new JSONObject();
                          n.put("date", today);
                          n.put("count", count);
                          int code = httpPutCond(cu, n.toString(), c[0]);
                          if (code != 412) return;
                      }
                  } catch (Exception ignored) {}
              }

              // GET with the ETag Firebase assigns to this exact node value. Returns {etag, body} or null.
              private static String[] httpGetEtag(String url) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod("GET");
                      c.setRequestProperty("X-Firebase-ETag", "true");
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      if (c.getResponseCode() != 200) return null;
                      String etag = c.getHeaderField("ETag");
                      if (etag == null) return null;
                      InputStream in = c.getInputStream();
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[1024];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                      in.close();
                      return new String[] { etag, out.toString("UTF-8") };
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              // PUT that only succeeds if the node still has this ETag. Returns the HTTP status (200 ok, 412 changed), -1 on error.
              private static int httpPutCond(String url, String jsonBody, String etag) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod("PUT");
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type", "application/json");
                      c.setRequestProperty("if-match", etag);
                      byte[] body = jsonBody.getBytes("UTF-8");
                      c.setFixedLengthStreamingMode(body.length);
                      OutputStream os = c.getOutputStream();
                      os.write(body);
                      os.close();
                      return c.getResponseCode();
                  } catch (Exception e) {
                      return -1;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              private static void httpPostJson(String url, String jsonBody) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod("POST");
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type", "application/json");
                      byte[] body = jsonBody.getBytes("UTF-8");
                      c.setFixedLengthStreamingMode(body.length);
                      OutputStream os = c.getOutputStream();
                      os.write(body);
                      os.close();
                      c.getResponseCode();
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              private static boolean httpPut(String url, String jsonBody) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setRequestMethod("PUT");
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type", "application/json");
                      byte[] body = jsonBody.getBytes("UTF-8");
                      c.setFixedLengthStreamingMode(body.length);
                      OutputStream os = c.getOutputStream();
                      os.write(body);
                      os.close();
                      int code = c.getResponseCode();
                      return code >= 200 && code < 300;
                  } catch (Exception e) {
                      return false;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }
          }

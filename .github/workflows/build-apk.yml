                  } catch (Exception ignored) {}
                  call.resolve();
              }

              // Called from driver.html right after the driver accepts / rejects a ride. If the phone is
              // locked (the app was showing over the lock screen), this brings up the normal PIN / pattern /
              // fingerprint screen; once the driver unlocks, the app is simply there, already open. Whatever
              // happens, the app stops showing over the lock screen afterwards (so after the next lock, the
              // phone's own lock screen protects it again). Does nothing if the phone is already unlocked.
              @PluginMethod
              public void requireUnlock(PluginCall call) {
                  if (MainActivity.unlockInFlight) { call.resolve(); return; }   // PIN prompt already up (native Accept)
                  final android.app.Activity act = getActivity();
                  if (act == null || android.os.Build.VERSION.SDK_INT < 27) { call.resolve(); return; }
                  act.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              android.app.KeyguardManager km = (android.app.KeyguardManager) act.getSystemService(android.content.Context.KEYGUARD_SERVICE);
                              if (km == null || !km.isKeyguardLocked()) {
                                  act.setShowWhenLocked(false);
                                  act.setTurnScreenOn(false);
                                  return;
                              }
                              km.requestDismissKeyguard(act, new android.app.KeyguardManager.KeyguardDismissCallback() {
                                  @Override
                                  public void onDismissSucceeded() {
                                      act.setShowWhenLocked(false);
                                      act.setTurnScreenOn(false);
                                  }
                                  @Override
                                  public void onDismissCancelled() {
                                      act.setShowWhenLocked(false);
                                      act.setTurnScreenOn(false);
                                  }
                                  @Override
                                  public void onDismissError() {
                                      act.setShowWhenLocked(false);
                                      act.setTurnScreenOn(false);
                                  }
                              });
                          } catch (Exception ignored) {}
                      }
                  });
                  call.resolve();
              }

              // Jobs the driver skipped in the native popup while the app was closed. driver.html adds them to
              // its own skipped lists so the same job does not pop up again inside the app. Cleared on read.
              @PluginMethod
              public void consumeSkippedIds(PluginCall call) {
                  JSObject r = new JSObject();
                  org.json.JSONArray arr = new org.json.JSONArray();
                  try {
                      android.content.SharedPreferences sp = getContext().getSharedPreferences(RideAlertActivity.SKIP_PREFS, 0);
                      long now = System.currentTimeMillis();
                      for (java.util.Map.Entry<String, ?> e : sp.getAll().entrySet()) {
                          Object v = e.getValue();
                          if (v instanceof Long && now - ((Long) v).longValue() < 1800000L) arr.put(e.getKey());
                      }
                      sp.edit().clear().apply();
                  } catch (Exception ignored) {}
                  r.put("ids", arr);
                  call.resolve(r);
              }

              // Ride finished without the driver acting (timed out / cancelled / taken): stop showing over
              // the lock screen. If the phone is still locked, the app goes behind the lock screen.
              @PluginMethod
              public void releaseLockScreen(PluginCall call) {
                  if (getActivity() instanceof MainActivity) ((MainActivity) getActivity()).releaseOverLockScreenFromJs();
                  call.resolve();
              }
          }

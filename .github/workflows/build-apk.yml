name: Build Combined APK (Driver + Partner)

# Runs entirely on GitHub's own cloud servers — nothing installed on your
# phone or any computer. Triggered manually from the "Actions" tab, or
# automatically every time you push a change to the repo.
#
# This replaces build-apk-driver.yml and build-apk-partner.yml. Instead of
# two separate apps, it produces ONE apk with a home screen where the user
# picks "Driver", "Restaurant Partner", or "Bus". Your www/ folder must contain:
#   www/index.html   <- portal chooser (Driver / Partner / Bus)
#   www/driver.html  <- old driver-app.html, renamed
#   www/partner.html <- old partner-app.html, renamed
#   www/bus.html     <- bus operator app (stops + live location broadcast)
#   www/manifest.json, www/icon-192.png, www/icon-512.png (shared, as before)
#
# NOTE on permissions: bus.html and driver.html both need background
# location (ACCESS_BACKGROUND_LOCATION, FOREGROUND_SERVICE_LOCATION) so
# they keep broadcasting the driver/bus's position every so often with the
# screen off or the app swiped away — bus.html every ~20s, driver.html
# via @capgo/background-geolocation's distance-filtered updates while a
# driver is online. Because all three portals ship in one APK, Android
# grants that permission to the WHOLE app — partner.html simply never
# calls the APIs that use it, so nothing changes there.
#
# IMPORTANT: because there is now only one app package
# (com.yourcompany.neshapp instead of two), you must register a NEW
# Android app with this exact package name in your Firebase project and
# replace google-services.json at the repo root with the one Firebase
# gives you for it. The old google-services.json (registered under
# com.yourcompany.restaurantpartner) will NOT work here.
on:
  workflow_dispatch:
    inputs:
      force_driver_update:
        description: 'Force the DRIVER app to update (blocks Driver until updated).'
        type: boolean
        default: false
      force_partner_update:
        description: 'Force the PARTNER app to update (blocks Partner until updated).'
        type: boolean
        default: false
      update_for:
        description: 'Which app should get this update prompt?'
        type: choice
        options:
          - all
          - driver
          - partner
        default: all
  # A normal push can't show a checkbox, so for pushes put [force-partner]
  # anywhere in the commit message to force the Partner app update for that build.
  # Likewise [driver-only] or [partner-only] in the commit message sends the update
  # prompt to just that app (default: both apps). [force-driver] forces the Driver
  # app update the same way [force-partner] forces the Partner one.
  push:
    branches: [main]

env:
  # Raise ONLY when native code changes (new plugin / permission / Java).
  # Must be the same number in the OTA publish + promote workflows.
  NATIVE_GEN: '7'

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so the "Publish APK to a GitHub Release" step below is allowed
    # to create a release. Without this, GitHub's default token is
    # read-only and the release step fails with a 403 error.
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (needed by Android build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # @capgo/background-geolocation's Android module is compiled
          # with sourceCompatibility 21, so Java 17 fails with "invalid
          # source release: 21". Bumped to 21 to match.
          java-version: '21'

      # android-actions/setup-android@v3 used to be here, but it calls the
      # legacy `sdkmanager ... tools` command — Google discontinued that
      # 'tools' package, so the action now fails every run with "Failed to
      # find package 'tools'". GitHub's ubuntu-latest runners already ship
      # a full Android SDK (cmdline-tools included) at $ANDROID_HOME/
      # $ANDROID_SDK_ROOT, so the step was just removed rather than fixed.

      - name: Install project dependencies
        run: |
          npm install --legacy-peer-deps
          # Pinned to an exact version instead of letting npm silently pick
          # up a different build on every run — that's how this app once
          # ended up on a build where BackgroundGeolocation.start()/.stop()/
          # .openSettings() didn't return real Promises (".then/.catch is
          # not a function" crashes) even though driver.html's code never
          # changed. Originally this pinned a literal version number
          # (8.0.43), but that exact version was later removed from the
          # npm registry — pinning a hardcoded number that can vanish out
          # from under the build isn't safe. So instead: resolve whatever
          # version is CURRENTLY published as "latest" at build time, then
          # pin the install to that exact resolved version (still
          # `--save-exact`, so within this one build nothing can silently
          # drift between the install and later steps). The resolved
          # version is echoed AND `npm ls` prints it again right after, so
          # a version change between builds is visible in the log instead
          # of showing up as a silent runtime crash.
          BGEO_VERSION=$(npm view @capgo/background-geolocation dist-tags.latest)
          echo "Resolved @capgo/background-geolocation version: $BGEO_VERSION"
          npm install @capgo/background-geolocation@$BGEO_VERSION --legacy-peer-deps --save-exact
          npm ls @capgo/background-geolocation --depth=0 || true
          # Lets driver.html prompt the driver to exempt the app from
          # Android's Doze/App-Standby battery optimization — on top of
          # OEM "clean up" managers (Xiaomi/Vivo/Oppo/Realme), this is
          # what actually keeps the background location service (and the
          # ride-alert ringing) from getting killed after the driver
          # swipes the app away from Recents while still online.
          npm install @capawesome-team/capacitor-android-battery-optimization --legacy-peer-deps
          # Lets driver.html open the phone brand's own Auto-start manager
          # screen (Xiaomi/Vivo/Oppo/Realme/Huawei/Samsung/etc.) directly
          # from the "Turn on Auto-start" modal, instead of only giving the
          # driver generic text instructions to find it themselves.
          npm install @squareetlabs/capacitor-dont-kill-my-app --legacy-peer-deps
          # Live-update (OTA) plugin. Major version must equal Capacitor core's major.
          CAP_MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          echo "Capacitor core major: $CAP_MAJOR"
          npm install @capgo/capacitor-updater@$CAP_MAJOR --legacy-peer-deps
          npm ls @capgo/capacitor-updater --depth=0 || true

      - name: Generate native Android project (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap init "NESH" "com.yourcompany.neshapp" --web-dir www
            npx cap add android
          fi

      # This repo's build has repeatedly hit a well-documented, long-
      # standing Gradle bug (gradle/gradle#25953, #28940, #29381, and
      # many duplicates — same "Failed to create Jar file ...
      # ExecutionException" signature reported against totally different
      # jars: jackson-core, tink, h2, kotlin-daemon-embeddable, and our
      # own bcprov-jdk18on) where Gradle's own classpath-instrumentation
      # step fails to repackage a plugin/buildscript-classpath jar. It's
      # not tied to one specific dependency, JDK version, or a race
      # condition (confirmed here: retries, --max-workers=1, and a JDK
      # bump all failed identically) — it's a bug in Gradle 8.2.1 itself.
      # One confirmed real-world fix for this exact error signature was
      # upgrading the Gradle version, so bump the wrapper here. Printing
      # the AGP version alongside it so if THIS also fails with a new
      # "requires Gradle version X" error, the real fix is a one-line
      # change instead of another guess.
      - name: Bump Gradle wrapper (works around a known Gradle 8.2.1 bug)
        working-directory: android
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          echo "---- AGP version in use ----"
          grep -rE "com\.android\.(application|tools\.build:gradle)" build.gradle settings.gradle 2>/dev/null || true

      # androidx.work:work-runtime:2.11.2 (pulled in by
      # @capgo/background-geolocation) requires compileSdk 35+ and AGP
      # 8.6.0+. Capacitor's default template ships AGP 8.2.1 / compileSdk
      # 34, which fails the ":app:checkDebugAarMetadata" task with a clear
      # "requires libraries... to compile against version 35" error.
      # Bumping both here fixes it.
      - name: Bump AGP and compileSdk/targetSdk (fixes work-runtime AAR metadata error)
        working-directory: android
        run: |
          sed -i "s#com\.android\.tools\.build:gradle:[0-9.]*#com.android.tools.build:gradle:8.6.0#" build.gradle
          sed -i -E "s/compileSdkVersion( *=)? *[0-9]+/compileSdkVersion = 35/" variables.gradle
          sed -i -E "s/targetSdkVersion( *=)? *[0-9]+/targetSdkVersion = 35/" variables.gradle
          # play-services-location:21.4.0 requires minSdk 23+; project default (22) is too low.
          sed -i -E "s/minSdkVersion( *=)? *[0-9]+/minSdkVersion = 23/" variables.gradle
          echo "---- variables.gradle after bump ----"
          cat variables.gradle
          echo "---- AGP version after bump ----"
          grep "com.android.tools.build" build.gradle

      # @capgo/background-geolocation needs this Capacitor config flag on
      # Android, otherwise location updates from the WebView still halt
      # after ~5 minutes in the background — the exact bug this plugin
      # swap was meant to fix. Patched here (idempotent) since
      # capacitor.config.json is committed to the repo and cap init only
      # creates it fresh the very first time.
      - name: Enable Android legacy bridge for background-geolocation
        run: |
          node -e "
            const fs = require('fs');
            const path = 'capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            cfg.android = cfg.android || {};
            cfg.android.useLegacyBridge = true;
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
          "

      - name: Configure OTA live updates (own Driver/Partner channel)
        run: |
          node -e "
            const fs = require('fs');
            const path = 'capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(path, 'utf8'));
            cfg.plugins = cfg.plugins || {};
            cfg.plugins.CapacitorUpdater = {
              autoUpdate: true,
              updateUrl: 'https://api.neshapp.in/ota/dp/update?g=' + process.env.NATIVE_GEN,
              statsUrl: '',
              channelUrl: '',
              directUpdate: false,
              appReadyTimeout: 20000,
              resetWhenUpdate: true,
              autoDeleteFailed: true,
              autoDeletePrevious: true
            };
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2));
            console.log(JSON.stringify(cfg.plugins.CapacitorUpdater));
          "

      - name: Add permissions and native components to AndroidManifest.xml
        # android/ is regenerated from scratch every run (never committed),
        # so every permission and every custom native component has to be
        # re-applied here every single build.
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi

          # Needed by bus.html (lets it keep sending location every ~20s
          # with the screen off or the app swiped away) AND by driver.html
          # (its @capgo/background-geolocation tracking, above — a driver
          # who's online keeps reporting position the same way). partner.html
          # doesn't request these, so it's unaffected and stays
          # foreground-only as before.
          if ! grep -q "ACCESS_BACKGROUND_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />' "$MANIFEST"
          fi

          # Lets driver.html show the system "Allow this app to ignore
          # battery optimizations?" dialog (via @capawesome-team/
          # capacitor-android-battery-optimization, above) — a driver who
          # taps Allow there is far less likely to have Android kill the
          # background location service after swiping the app away while
          # online.
          if ! grep -q "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />' "$MANIFEST"
          fi

          # Lets @squareetlabs/capacitor-dont-kill-my-app (above) detect and
          # open each OEM's own Auto-start manager app from driver.html's
          # "Turn on Auto-start" modal — without these <queries> entries,
          # Android 11+'s package-visibility restrictions hide these apps
          # from this app even if they're installed, and requestAutoStart()
          # silently fails to find the right screen to open.
          if ! grep -q "com.miui.securitycenter" "$MANIFEST"; then
            python3 - "$MANIFEST" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          queries_block = '''    <queries>
          <package android:name="com.asus.mobilemanager" />
          <package android:name="com.miui.securitycenter" />
          <package android:name="com.letv.android.letvsafe" />
          <package android:name="com.huawei.systemmanager" />
          <package android:name="com.coloros.safecenter" />
          <package android:name="com.oppo.safe" />
          <package android:name="com.iqoo.secure" />
          <package android:name="com.vivo.permissionmanager" />
          <package android:name="com.evenwell.powersaving.g3" />
          <package android:name="com.samsung.android.lool" />
          <package android:name="com.oneplus.security" />
          <package android:name="com.lenovo.powersetting" />
          <package android:name="com.meizu.safe" />
          </queries>
          '''
          content = content.replace('<application', queries_block + '    <application', 1)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF
          fi

          if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />' "$MANIFEST"
          fi

          # Lets the Operator alert open its full-screen screen even while the
          # phone is unlocked and in use (needs the person to allow "Display over
          # other apps" once - the app asks for it when the Operator Panel opens).
          if ! grep -q "android.permission.SYSTEM_ALERT_WINDOW" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' "$MANIFEST"
          fi

          # Lets the app trigger the system "Install this app?" prompt
          # itself (for the in-app auto-update banner) instead of routing
          # the person through their browser's download flow first. The
          # actual FileProvider <provider> entry that makes this safe
          # (sharing a downloaded APK file without exposing raw file://
          # paths) is added further down, right before </application>.
          if ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' "$MANIFEST"
          fi

          # Register ONE AlertFcmService as the app's sole FCM receiver.
          # Firebase only allows a single FirebaseMessagingService per app,
          # which is exactly why the driver app's RideAlertFcmService and
          # the partner app's OrderAlertFcmService had to be merged into
          # one class (AlertFcmService, added further down) instead of
          # registering two.
          if ! grep -q "AlertFcmService" "$MANIFEST"; then
            python3 - "$MANIFEST" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          injection = '''
              <service android:name=".AlertFcmService" android:exported="false">
                  <intent-filter>
                      <action android:name="com.google.firebase.MESSAGING_EVENT" />
                  </intent-filter>
              </service>
              <service android:name=".RingingService" android:exported="false" android:foregroundServiceType="mediaPlayback" />
              <activity android:name=".RideAlertActivity"
                  android:exported="false"
                  android:launchMode="singleTask"
                  android:taskAffinity=""
                  android:excludeFromRecents="true"
                  android:showWhenLocked="true"
                  android:turnScreenOn="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" />
              <activity android:name=".RingingActivity"
                  android:exported="false"
                  android:launchMode="singleInstance"
                  android:excludeFromRecents="true"
                  android:showOnLockScreen="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" />
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
          </application>'''
          content = content.replace('</application>', injection, 1)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF
          fi

          # The FileProvider entry above points at this file_paths.xml,
          # which whitelists the app's own cache folder — that's where the
          # downloaded update APK gets saved (see ApkInstallerPlugin.java)
          # before the system installer is asked to open it.
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="update_apk" path="." />
          </paths>
          EOF

          # Override the android:stopWithTask default (which is `true`) on
          # @capgo/background-geolocation's own foreground-location service
          # — confirmed via a build's merged manifest (see the diagnostic
          # step at the end of this workflow) to be named
          # com.capgo.capacitor_background_geolocation.BackgroundGeolocationService.
          # Without this, Android stops that service — and with it, all
          # location updates — the moment a driver swipes NESH Driver away
          # from Recents while online, even though it's a proper foreground
          # service with its own persistent notification. Apps like
          # Swiggy's driver app survive a swipe for exactly this reason:
          # their equivalent service is declared with stopWithTask="false".
          # `tools:node="merge"` matches this <service> to the plugin's own
          # declaration (matched by android:name) during Gradle's manifest
          # merge and adds/overrides just this one attribute, leaving the
          # plugin's own <service> otherwise untouched.
          if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android"#<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"#' "$MANIFEST"
          fi
          if ! grep -q 'android:stopWithTask="false"' "$MANIFEST"; then
            python3 - "$MANIFEST" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          injection = '''
              <service
                  android:name="com.capgo.capacitor_background_geolocation.BackgroundGeolocationService"
                  android:stopWithTask="false"
                  tools:node="merge" />
          </application>'''
          content = content.replace('</application>', injection, 1)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF
          fi

          # Lets BootCompletedReceiver (added further down) see the phone
          # finish booting, so a driver who was online when the phone
          # restarted doesn't have to notice and manually reopen the app —
          # see BootCompletedReceiver.java for what it actually does on
          # boot (launches MainActivity, which is the ONLY place that
          # correctly knows how to call BackgroundGeolocation.start() with
          # the right options — driver.html's own startup code already
          # does this automatically when it finds nesh_driver_online_* set,
          # so the receiver doesn't need to duplicate that logic).
          if ! grep -q "RECEIVE_BOOT_COMPLETED" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' "$MANIFEST"
          fi
          if ! grep -q "BootCompletedReceiver" "$MANIFEST"; then
            python3 - "$MANIFEST" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          injection = '''
              <receiver android:name=".BootCompletedReceiver" android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                  </intent-filter>
              </receiver>
          </application>'''
          content = content.replace('</application>', injection, 1)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF
          fi

          # Foreground service (type location) that uploads the driver's position natively - see
          # NativeLocationService.java. stopWithTask="false" so it survives a swipe from Recents.
          if ! grep -q "NativeLocationService" "$MANIFEST"; then
            python3 - "$MANIFEST" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          injection = '''
              <service android:name=".NativeLocationService" android:exported="false" android:foregroundServiceType="location" android:stopWithTask="false" />
          </application>'''
          content = content.replace('</application>', injection, 1)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF
          fi

      - name: Generate app icon from resources/icon.png
        run: |
          npm install -D @capacitor/assets --legacy-peer-deps
          npx capacitor-assets generate --android

      - name: Add Firebase config to the Android project
        # google-services.json must be the one Firebase generates for the
        # com.yourcompany.neshapp package (see note at the top of this file).
        run: |
          cp google-services.json android/app/google-services.json

          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          fi

          if ! grep -q "apply plugin: 'com.google.gms.google-services'" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Add Firebase Messaging and AndroidX dependencies
        run: |
          if ! grep -q "firebase-messaging" android/app/build.gradle; then
            sed -i "/dependencies {/a\\    implementation 'com.google.firebase:firebase-messaging:23.4.0'\n    implementation 'androidx.annotation:annotation:1.7.1'" android/app/build.gradle
          fi
          # WorkManager powers LocationHealthCheckWorker (see the native
          # sources step below) — the periodic job that notices when
          # BackgroundGeolocation's service has died (OEM battery killer,
          # low-memory kill — the cases stopWithTask="false" alone doesn't
          # cover) and prompts the driver to resume instead of silently
          # sitting offline until they happen to reopen the app themselves.
          if ! grep -q "androidx.work:work-runtime" android/app/build.gradle; then
            sed -i "/dependencies {/a\\    implementation 'androidx.work:work-runtime:2.9.0'" android/app/build.gradle
          fi

      - name: Add custom alert sounds (order + ride)
        # Both sound files are needed since a single app now handles both
        # kinds of alerts.
        run: |
          mkdir -p android/app/src/main/res/raw
          cp order_alert.mp3 android/app/src/main/res/raw/order_alert.mp3
          cp ride_alert.mp3 android/app/src/main/res/raw/ride_alert.mp3

      - name: Add native alert-handling classes
        # android/ is regenerated fresh every build, so all Java files are
        # rewritten here every time rather than committed and edited by
        # hand. AlertFcmService/RingingService/RingingActivity are shared
        # by BOTH portals; MainActivity routes to driver.html or
        # partner.html depending on which kind of alert was tapped.
        run: |
          PKG_PATH="android/app/src/main/java/com/yourcompany/neshapp"
          mkdir -p "$PKG_PATH"

          cat > "$PKG_PATH/AppState.java" << 'EOF'
          package com.yourcompany.neshapp;

          // Tracks whether an Activity of this app is currently visible, so
          // AlertFcmService can decide whether to hand an alert to the
          // already-open web app (in-app popup/ring) or start the native
          // full-screen ringing screen instead. NOTE: this is app-wide, not
          // per-portal — if you want a ride alert to still ring natively
          // while the partner portal is open (or vice versa), this flag
          // needs to be made portal-aware.
          public class AppState {
              public static volatile boolean isForeground = false;
          }
          EOF

          # Small SharedPreferences-backed store, written from driver.html
          # (setOnlineState() on every online/offline toggle,
          # recordHeartbeat() on every location fix) and read from
          # LocationHealthCheckWorker/BootCompletedReceiver below. Plain
          # SharedPreferences (not Firebase) on purpose — it has to be
          # readable even when the app process was fully killed and there's
          # no WebView/JS/network available yet to ask Firebase anything.
          cat > "$PKG_PATH/DriverTrackingPlugin.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.location.LocationManager;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import androidx.work.ExistingPeriodicWorkPolicy;
          import androidx.work.PeriodicWorkRequest;
          import androidx.work.WorkManager;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.concurrent.TimeUnit;
          import android.content.Intent;
          import androidx.core.content.ContextCompat;

          // JS usage (see driver.html):
          //   window.Capacitor.Plugins.DriverTrackingPlugin.setOnlineState({ online: true/false })
          //   window.Capacitor.Plugins.DriverTrackingPlugin.recordHeartbeat()
          @CapacitorPlugin(name = "DriverTrackingPlugin")
          public class DriverTrackingPlugin extends Plugin {
              public static final String PREFS_NAME = "nesh_driver_tracking";
              public static final String KEY_ONLINE = "should_be_online";
              public static final String KEY_HEARTBEAT = "last_heartbeat_ms";
              public static final String KEY_USERNAME = "driver_username";
              // Driver profile copy for the native (WebView-free) accept in RideAlertActivity.
              public static final String KEY_DRIVER_NAME = "driver_name";
              public static final String KEY_DRIVER_PHONE = "driver_phone";
              public static final String KEY_DRIVER_VEHICLE = "driver_vehicle_number";
              // Last time NativeLocationService itself uploaded a fix (while the web app was gone).
              public static final String KEY_NATIVE_UPLOAD = "last_native_upload_ms";
              private static final String HEALTH_CHECK_WORK_NAME = "nesh_location_health_check";

              @PluginMethod
              public void setOnlineState(PluginCall call) {
                  boolean online = call.getBoolean("online", false);
                  String username = call.getString("username", "");
                  SharedPreferences prefs = getContext().getSharedPreferences(PREFS_NAME, 0 /* MODE_PRIVATE */);
                  SharedPreferences.Editor editor = prefs.edit().putBoolean(KEY_ONLINE, online);
                  if (online) editor.putLong(KEY_HEARTBEAT, System.currentTimeMillis());
                  if (username != null && !username.isEmpty()) editor.putString(KEY_USERNAME, username);
                  editor.apply();

                  // Native location uploader: keeps taxi_drivers/{id}/location fresh in Firebase after the app is swiped
                  // away (the WebView - and with it driver.html's own Firebase writes - is destroyed then).
                  // Started here, while the app is on screen, because Android only allows starting a foreground
                  // service from the foreground.
                  try {
                      Intent locationService = new Intent(getContext(), NativeLocationService.class);
                      String savedUser = prefs.getString(KEY_USERNAME, "");
                      if (online && savedUser != null && !savedUser.isEmpty()) {
                          ContextCompat.startForegroundService(getContext(), locationService);
                      } else {
                          getContext().stopService(locationService);
                      }
                  } catch (Exception e) {
                      // never let the uploader break the normal go-online / go-offline flow
                  }

                  WorkManager workManager = WorkManager.getInstance(getContext());
                  if (online) {
                      // Minimum WorkManager periodic interval is 15 minutes —
                      // this is a safety net for the rare case where the
                      // foreground service itself got killed (OEM battery
                      // manager, low memory), not the normal update path
                      // (that's BackgroundGeolocation's own 60s heartbeat /
                      // 15m distanceFilter, unaffected by this).
                      PeriodicWorkRequest request = new PeriodicWorkRequest.Builder(
                          LocationHealthCheckWorker.class, 15, TimeUnit.MINUTES
                      ).build();
                      workManager.enqueueUniquePeriodicWork(
                          HEALTH_CHECK_WORK_NAME, ExistingPeriodicWorkPolicy.KEEP, request
                      );
                  } else {
                      workManager.cancelUniqueWork(HEALTH_CHECK_WORK_NAME);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void saveDriverProfile(PluginCall call) {
                  String username = call.getString("username", "");
                  String name = call.getString("name", "");
                  if (username == null || username.isEmpty() || name == null || name.isEmpty()) { call.resolve(); return; }
                  getContext().getSharedPreferences(PREFS_NAME, 0).edit()
                      .putString(KEY_USERNAME, username)
                      .putString(KEY_DRIVER_NAME, name)
                      .putString(KEY_DRIVER_PHONE, call.getString("phone", ""))
                      .putString(KEY_DRIVER_VEHICLE, call.getString("vehicleNumber", ""))
                      .apply();
                  call.resolve();
              }

              @PluginMethod
              public void recordHeartbeat(PluginCall call) {
                  getContext().getSharedPreferences(PREFS_NAME, 0)
                      .edit().putLong(KEY_HEARTBEAT, System.currentTimeMillis()).apply();
                  call.resolve();
              }

              // true = the phone's location service (GPS/network) is switched on. driver.html shows a
              // "GPS is off" banner when this says false while the driver is online.
              @PluginMethod
              public void isLocationEnabled(PluginCall call) {
                  boolean enabled = true;
                  try {
                      LocationManager lm = (LocationManager) getContext().getSystemService(Context.LOCATION_SERVICE);
                      if (lm != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              enabled = lm.isLocationEnabled();
                          } else {
                              enabled = lm.isProviderEnabled(LocationManager.GPS_PROVIDER)
                                  || lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER);
                          }
                      }
                  } catch (Exception e) {
                      enabled = true;   // can't tell -> don't show a false warning
                  }
                  JSObject ret = new JSObject();
                  ret.put("enabled", enabled);
                  call.resolve(ret);
              }

              // Opens the system Location settings screen (for the "Turn on GPS" button).
              @PluginMethod
              public void openLocationSettings(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  } catch (Exception ignored) { }
                  call.resolve();
              }
          }
          EOF

          # Uploads this driver's location to Firebase from NATIVE code, so it keeps working after the app is
          # swiped away from Recents (see the comment at the top of the class for the full reason).
          cat > "$PKG_PATH/NativeLocationService.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import androidx.annotation.Nullable;
          import androidx.core.app.NotificationCompat;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          // Keeps taxi_drivers/{id}/location fresh in Firebase EVEN AFTER THE APP IS SWIPED AWAY.
          //
          // Why this exists: @capgo/background-geolocation's own service keeps running after a swipe
          // (stopWithTask=false), but it hands every fix to JavaScript, and the JS that writes to Firebase
          // (handleDriverLocationFix + the 60s heartbeat in driver.html) lives in the WebView, which Android
          // destroys together with the Activity. So the GPS kept running and nothing was uploaded.
          //
          // This service does its own GPS + a plain HTTPS write to the Realtime Database REST API (same node and
          // same fields the JS writes), with no WebView involved. It only uploads while the web app is NOT
          // doing it (Activity not visible AND no JS heartbeat for 90s), so there are no duplicate writes.
          // Started/stopped from DriverTrackingPlugin.setOnlineState().
          public class NativeLocationService extends Service implements LocationListener {
              private static final String CHANNEL_ID = "nesh_native_location";
              private static final int NOTIFICATION_ID = 9102;
              private static final String DB_URL = "https://texi-and-food-default-rtdb.firebaseio.com";
              private static final long TICK_MS = 30 * 1000L;
              private static final long JS_ALIVE_MS = 90 * 1000L;          // JS wrote a heartbeat this recently -> it owns the upload (JS beats every 60s; 90s leaves room for a throttled background timer)
              private static final long MIN_UPLOAD_GAP_MS = 10 * 1000L;    // same throttle as driver.html
              private static final long HEARTBEAT_MS = 55 * 1000L;         // re-write last fix when parked (driver.html does 60s)
              private static final long ONLINE_CHECK_MS = 3 * 60 * 1000L;  // safety: stop if Firebase says the driver is offline

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private boolean hasFix = false;
              private double lastLat = 0;
              private double lastLng = 0;
              private long lastGpsAt = 0;
              private long lastUploadAt = 0;
              private long lastOnlineCheckAt = 0;

              private final Runnable ticker = new Runnable() {
                  @Override
                  public void run() {
                      long now = System.currentTimeMillis();
                      if (now - lastUploadAt >= HEARTBEAT_MS) maybeUpload(true);
                      if (now - lastOnlineCheckAt >= ONLINE_CHECK_MS) {
                          lastOnlineCheckAt = now;
                          checkStillOnline();
                      }
                      handler.postDelayed(this, TICK_MS);
                  }
              };

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  SharedPreferences prefs = getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0);
                  String user = prefs.getString(DriverTrackingPlugin.KEY_USERNAME, "");
                  boolean online = prefs.getBoolean(DriverTrackingPlugin.KEY_ONLINE, false);
                  if (!online || user == null || user.isEmpty()) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  try {
                      startInForeground();
                  } catch (Exception e) {
                      // e.g. Android refused a foreground start from the background - give up quietly
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  lastOnlineCheckAt = System.currentTimeMillis();   // first Firebase online-check in 3 min, not immediately
                  startLocationUpdates();
                  handler.removeCallbacks(ticker);
                  handler.postDelayed(ticker, TICK_MS);
                  return START_STICKY;
              }

              private void startInForeground() {
                  NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && manager != null) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Live location", NotificationManager.IMPORTANCE_LOW);
                      channel.setShowBadge(false);
                      manager.createNotificationChannel(channel);
                  }
                  Intent open = new Intent(this, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) piFlags |= PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, piFlags);
                  Notification n = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("NESH Driver - Online")
                      .setContentText("Your location stays live so you keep receiving orders.")
                      .setSmallIcon(getApplicationInfo().icon)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setContentIntent(pi)
                      .build();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(NOTIFICATION_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                  } else {
                      startForeground(NOTIFICATION_ID, n);
                  }
              }

              private void startLocationUpdates() {
                  LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  if (lm == null) return;
                  try { lm.removeUpdates(this); } catch (Exception ignored) { }
                  try {
                      if (lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                          lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 10000L, 15f, this, Looper.getMainLooper());
                      }
                  } catch (Exception ignored) { }
                  try {
                      if (lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) {
                          lm.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 20000L, 50f, this, Looper.getMainLooper());
                      }
                  } catch (Exception ignored) { }
                  // Seed with the last known position so a parked driver is uploaded right away.
                  if (!hasFix) {
                      try {
                          Location seed = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                          if (seed == null) seed = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                          if (seed != null) {
                              lastLat = seed.getLatitude();
                              lastLng = seed.getLongitude();
                              hasFix = true;
                          }
                      } catch (Exception ignored) { }
                  }
              }

              @Override
              public void onLocationChanged(Location loc) {
                  if (loc == null) return;
                  boolean isGps = LocationManager.GPS_PROVIDER.equals(loc.getProvider());
                  long now = System.currentTimeMillis();
                  if (!isGps && now - lastGpsAt < 60 * 1000L) return;   // prefer GPS while it is delivering
                  if (isGps) lastGpsAt = now;
                  lastLat = loc.getLatitude();
                  lastLng = loc.getLongitude();
                  hasFix = true;
                  maybeUpload(false);
              }

              private void maybeUpload(boolean force) {
                  if (!hasFix) return;
                  SharedPreferences prefs = getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0);
                  if (!prefs.getBoolean(DriverTrackingPlugin.KEY_ONLINE, false)) {
                      stopSelf();
                      return;
                  }
                  long now = System.currentTimeMillis();
                  // Phone's location switch is OFF: the last fix is not trustworthy, don't keep re-stamping it as fresh.
                  if (!isLocationOn()) return;
                  // The web app is alive and writing (screen on, or backgrounded with its WebView still running): stay out of the way.
                  if (AppState.isForeground || now - prefs.getLong(DriverTrackingPlugin.KEY_HEARTBEAT, 0) < JS_ALIVE_MS) return;
                  if (!force && now - lastUploadAt < MIN_UPLOAD_GAP_MS) return;
                  final String user = prefs.getString(DriverTrackingPlugin.KEY_USERNAME, "");
                  if (user == null || user.isEmpty()) return;
                  lastUploadAt = now;
                  final double lat = lastLat;
                  final double lng = lastLng;
                  final long ts = now;
                  executor.execute(new Runnable() {
                      @Override
                      public void run() { putLocation(user, lat, lng, ts); }
                  });
              }

              private boolean isLocationOn() {
                  try {
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      if (lm == null) return true;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) return lm.isLocationEnabled();
                      return lm.isProviderEnabled(LocationManager.GPS_PROVIDER) || lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER);
                  } catch (Exception e) {
                      return true;   // can't tell -> behave as before
                  }
              }

              private void putLocation(String user, double lat, double lng, long ts) {
                  HttpURLConnection c = null;
                  try {
                      c = open(DB_URL + "/taxi_drivers/" + enc(user) + "/location.json", "PUT");
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type", "application/json");
                      byte[] body = String.format(Locale.US, "{\"lat\":%.7f,\"lng\":%.7f,\"updatedAt\":%d}", lat, lng, ts).getBytes("UTF-8");
                      c.setFixedLengthStreamingMode(body.length);
                      OutputStream os = c.getOutputStream();
                      os.write(body);
                      os.close();
                      int code = c.getResponseCode();
                      if (code >= 200 && code < 300) {
                          getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0)
                              .edit().putLong(DriverTrackingPlugin.KEY_NATIVE_UPLOAD, ts).apply();
                      }
                  } catch (Exception ignored) {
                      // no network right now - the next tick tries again
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              // If the driver went offline some other way (operator, another device) don't keep a ghost service alive.
              private void checkStillOnline() {
                  SharedPreferences prefs = getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0);
                  final String user = prefs.getString(DriverTrackingPlugin.KEY_USERNAME, "");
                  if (user == null || user.isEmpty()) return;
                  executor.execute(new Runnable() {
                      @Override
                      public void run() {
                          HttpURLConnection c = null;
                          try {
                              c = open(DB_URL + "/taxi_drivers/" + enc(user) + "/isOnline.json", "GET");
                              if (c.getResponseCode() == 200) {
                                  String body = readAll(c.getInputStream()).trim();
                                  if ("false".equals(body)) {
                                      getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0)
                                          .edit().putBoolean(DriverTrackingPlugin.KEY_ONLINE, false).apply();
                                      handler.post(new Runnable() {
                                          @Override
                                          public void run() { stopSelf(); }
                                      });
                                  }
                              }
                          } catch (Exception ignored) {
                          } finally {
                              if (c != null) c.disconnect();
                          }
                      }
                  });
              }

              private HttpURLConnection open(String url, String method) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setRequestMethod(method);
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(8000);
                  return c;
              }

              private static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return s; }
              }

              private static String readAll(InputStream in) throws Exception {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] buf = new byte[256];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  in.close();
                  return out.toString("UTF-8");
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(ticker);
                  try {
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      if (lm != null) lm.removeUpdates(this);
                  } catch (Exception ignored) { }
                  executor.shutdown();
                  super.onDestroy();
              }

              @Override
              public void onProviderEnabled(String provider) {
                  startLocationUpdates();
              }

              @Override
              public void onProviderDisabled(String provider) { }

              @Override
              @SuppressWarnings("deprecation")
              public void onStatusChanged(String provider, int status, Bundle extras) { }

              @Nullable
              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # Runs roughly every 15 minutes (WorkManager's own minimum — see
          # DriverTrackingPlugin above) while the driver should be online.
          # Does NOT touch location itself — it only checks whether a fresh
          # heartbeat has arrived recently and, if not (tracking silently
          # died — OEM battery kill, low-memory kill), raises a normal
          # notification asking the driver to reopen the app.
          #
          # Deliberately does NOT try to restart BackgroundGeolocation's
          # service directly from here: Android blocks starting an Activity
          # from a background Worker (no exemption applies here, unlike
          # BOOT_COMPLETED below), and guessing at the plugin's internal
          # Intent contract to poke its service directly — without its
          # source available to confirm the extras it expects — risks a
          # "restart" that either crashes or silently no-ops, which is
          # worse than a driver getting a tap-to-resume notification. A
          # tapped notification IS an Android-trusted trigger, so it can
          # reliably launch MainActivity, and driver.html's own startup
          # code already knows how to resume tracking correctly from there
          # (same nesh_driver_online_* check used on every normal app open).
          cat > "$PKG_PATH/LocationHealthCheckWorker.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.work.Worker;
          import androidx.work.WorkerParameters;
          import androidx.annotation.NonNull;

          public class LocationHealthCheckWorker extends Worker {
              private static final long STALE_THRESHOLD_MS = 4 * 60 * 1000; // 4 min — a bit above the 3-min matching threshold in driver.html so a driver isn't notified for a gap that hasn't actually cost them anything yet
              private static final String CHANNEL_ID = "location_health_check";
              private static final int NOTIFICATION_ID = 9101;

              public LocationHealthCheckWorker(@NonNull Context context, @NonNull WorkerParameters params) {
                  super(context, params);
              }

              @NonNull
              @Override
              public Result doWork() {
                  Context context = getApplicationContext();
                  SharedPreferences prefs = context.getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0);
                  boolean shouldBeOnline = prefs.getBoolean(DriverTrackingPlugin.KEY_ONLINE, false);
                  if (!shouldBeOnline) return Result.success();

                  long lastHeartbeat = Math.max(prefs.getLong(DriverTrackingPlugin.KEY_HEARTBEAT, 0), prefs.getLong(DriverTrackingPlugin.KEY_NATIVE_UPLOAD, 0)); // native uploads count too
                  long age = System.currentTimeMillis() - lastHeartbeat;
                  if (age < STALE_THRESHOLD_MS) return Result.success(); // tracking is fine, nothing to do

                  showResumeNotification(context);
                  return Result.success();
              }

              private void showResumeNotification(Context context) {
                  NotificationManager manager = context.getSystemService(NotificationManager.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && manager != null) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "Location Tracking", NotificationManager.IMPORTANCE_HIGH
                      );
                      manager.createNotificationChannel(channel);
                  }

                  Intent activityIntent = new Intent(context, MainActivity.class);
                  activityIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) flags |= PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent pendingIntent = PendingIntent.getActivity(context, 0, activityIntent, flags);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)
                      .setContentTitle("Location tracking paused")
                      .setContentText("Tap to resume sharing your location and keep receiving orders.")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setAutoCancel(true)
                      .setContentIntent(pendingIntent);
                  // Uses the launcher icon as a safe default — swap in a
                  // dedicated small icon resource later if you want one.
                  builder.setSmallIcon(context.getApplicationInfo().icon);

                  if (manager != null) manager.notify(NOTIFICATION_ID, builder.build());
              }
          }
          EOF

          # Relaunches MainActivity after a phone reboot if the driver was
          # online when it restarted — BOOT_COMPLETED is one of the few
          # background contexts Android explicitly allows starting an
          # Activity from, so this (unlike the Worker above) CAN silently
          # bring the app back without waiting for a notification tap.
          # driver.html's own startup code (the nesh_driver_online_* check
          # that already runs on every normal app open) is what actually
          # resumes tracking once MainActivity/the WebView loads — this
          # receiver's only job is getting that code to run again.
          cat > "$PKG_PATH/BootCompletedReceiver.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          public class BootCompletedReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || !Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) return;

                  SharedPreferences prefs = context.getSharedPreferences(DriverTrackingPlugin.PREFS_NAME, 0);
                  boolean shouldBeOnline = prefs.getBoolean(DriverTrackingPlugin.KEY_ONLINE, false);
                  if (!shouldBeOnline) return;

                  Intent launch = new Intent(context, MainActivity.class);
                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  context.startActivity(launch);
              }
          }
          EOF

          cat > "$PKG_PATH/MainActivity.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RingControlPlugin.class);
                  registerPlugin(ApkInstallerPlugin.class);
                  registerPlugin(DriverTrackingPlugin.class);
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      AudioAttributes audioAttributes = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();

                      Uri orderUri = Uri.parse(ContentResolver.SCHEME_ANDROID_RESOURCE + "://" + getPackageName() + "/raw/order_alert");
                      NotificationChannel legacyChannel = new NotificationChannel(
                          "order_alerts", "Order Alerts", NotificationManager.IMPORTANCE_HIGH
                      );
                      legacyChannel.setSound(orderUri, audioAttributes);
                      legacyChannel.enableVibration(true);
                      legacyChannel.setVibrationPattern(new long[]{0, 800, 300, 800, 300, 800, 300, 800});
                      legacyChannel.setBypassDnd(true);
                      manager.createNotificationChannel(legacyChannel);

                      // Vibration-only alert for "pickup ready" pings to a
                      // delivery driver who already accepted the job — no
                      // sound, just one long buzz, so it reads as a nudge
                      // rather than a full alarm. setSound(null, null) is
                      // what actually silences it; the worker's per-message
                      // "sound" field in the FCM payload can't override a
                      // channel's sound once the channel exists, which is
                      // why this needs its own channel instead of reusing
                      // order_alerts.
                      NotificationChannel pickupReadyChannel = new NotificationChannel(
                          "pickup_ready_alerts", "Pickup Ready Alerts", NotificationManager.IMPORTANCE_HIGH
                      );
                      pickupReadyChannel.setSound(null, null);
                      pickupReadyChannel.enableVibration(true);
                      pickupReadyChannel.setVibrationPattern(new long[]{0, 1000});
                      pickupReadyChannel.setBypassDnd(true);
                      manager.createNotificationChannel(pickupReadyChannel);
                  }

                  applyLockScreenMode(getIntent());
                  handleIncomingIntent(getIntent());
              }

              // Launched from a ride/delivery alert (RingingService sets "lockscreen"):
              // show this Activity ON TOP of the lock screen and wake the screen, so the
              // driver sees the ride popup and can accept/reject without unlocking
              // (Uber-style). A normal launch from the icon turns it back off.
              private final android.os.Handler lockHandler = new android.os.Handler(android.os.Looper.getMainLooper());
              private final Runnable lockRelease = new Runnable() {
                  @Override public void run() { releaseOverLockScreen(); }
              };

              private void setOverLockScreen(boolean on) {
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(on);
                      setTurnScreenOn(on);
                  } else {
                      int f = android.view.WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED | android.view.WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON;
                      if (on) getWindow().addFlags(f); else getWindow().clearFlags(f);
                  }
              }

              public void releaseOverLockScreenFromJs() {
                  runOnUiThread(new Runnable() { @Override public void run() { releaseOverLockScreen(); } });
              }

              // Stop showing over the lock screen. If the phone is still locked, push the app behind the
              // lock screen so nobody can use it without unlocking.
              private void releaseOverLockScreen() {
                  try {
                      android.app.KeyguardManager km = (android.app.KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                      boolean locked = km != null && km.isKeyguardLocked();
                      setOverLockScreen(false);
                      if (locked) moveTaskToBack(true);
                  } catch (Exception ignored) {}
              }

              private void applyLockScreenMode(Intent intent) {
                  boolean on = intent != null && intent.getBooleanExtra("lockscreen", false);
                  setOverLockScreen(on);
                  // Safety net: if nobody accepts/rejects (ride timed out, cancelled, driver walked away),
                  // don't leave the app open over the lock screen for more than 2 minutes.
                  lockHandler.removeCallbacks(lockRelease);
                  if (on) lockHandler.postDelayed(lockRelease, 120000L);
              }

              // Accept from the native popup: if the phone is locked, ask for the PIN / pattern / fingerprint
              // right away (the accept itself runs in the page meanwhile), so the whole app is never usable
              // over the lock screen. Shared with RingControlPlugin.requireUnlock via unlockInFlight.
              public static volatile boolean unlockInFlight = false;
              private boolean pendingUnlock = false;

              private void runPendingUnlock() {
                  if (!pendingUnlock) return;
                  pendingUnlock = false;
                  lockHandler.postDelayed(new Runnable() {
                      @Override public void run() { startUnlock(); }
                  }, 200L);
              }

              private void startUnlock() {
                  if (Build.VERSION.SDK_INT < 27) return;
                  try {
                      android.app.KeyguardManager km = (android.app.KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                      if (km == null || !km.isKeyguardLocked() || unlockInFlight) return;
                      unlockInFlight = true;
                      km.requestDismissKeyguard(this, new android.app.KeyguardManager.KeyguardDismissCallback() {
                          @Override public void onDismissSucceeded() { unlockInFlight = false; setOverLockScreen(false); }
                          @Override public void onDismissCancelled() { unlockInFlight = false; setOverLockScreen(false); }
                          @Override public void onDismissError() { unlockInFlight = false; setOverLockScreen(false); }
                      });
                  } catch (Exception e) {
                      unlockInFlight = false;
                  }
              }

              @Override
              public void onDestroy() {
                  lockHandler.removeCallbacks(lockRelease);
                  unlockInFlight = false;
                  super.onDestroy();
              }

              @Override
              public void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  applyLockScreenMode(intent);
                  handleIncomingIntent(intent);
              }

              @Override
              public void onResume() {
                  super.onResume();
                  AppState.isForeground = true;
                  runPendingUnlock();
                  // NOTE: opening the app by itself does NOT stop
                  // RingingService any more — only an explicit accept/
                  // reject/skip action (via the RingControl plugin, called
                  // from driver.html/partner.html's own action handlers)
                  // or RingingService's own 30-second timeout clears the
                  // ringing notification. See RingControlPlugin.java.
              }

              @Override
              public void onPause() {
                  super.onPause();
                  AppState.isForeground = false;
              }

              // If this launch came from the native ringing screen (user
              // tapped Accept/Reject/Open while the app was closed), first
              // navigate the WebView to the right portal page, then forward
              // the action into that page's own JS once it has finished
              // loading. window.handleNativeRideAction (used for both
              // "ride" and "delivery" kinds — driver.html's own
              // handlePopupItemAction already branches on the kind
              // argument) / window.handleNativeOrderAction (used for
              // "order") self-retry until the page's own script is ready,
              // so exact WebView load timing doesn't matter.
              //
              // "kind" is one of "ride" / "delivery" / "order" and comes
              // straight from RingingActivity, which itself derived it from
              // the FCM push's "type" field (new_ride / new_delivery /
              // new_order). The three kinds need different id formats:
              //   ride     -> plain rideId
              //   delivery -> composite "restId::orderId" (that's the exact
              //               format driver.html's handlePopupDeliveryAction
              //               expects — see RingingActivity for where this
              //               composite id gets built)
              //   order    -> plain orderId
              private static String lastAlertKey = "";
              private static long lastAlertAt = 0;

              private void handleIncomingIntent(Intent intent) {
                  if (intent == null) return;
                  String kind = intent.getStringExtra("kind");
                  String action = intent.getStringExtra("action");
                  String id = intent.getStringExtra("id");
                  if (kind == null || action == null) return;

                  // Same alert delivered twice within a few seconds (e.g. lock-screen intent + direct
                  // start) - only handle it once.
                  String alertKey = kind + "|" + action + "|" + (id != null ? id : "");
                  long nowMs = System.currentTimeMillis();
                  if (alertKey.equals(lastAlertKey) && nowMs - lastAlertAt < 8000L) return;
                  lastAlertKey = alertKey;
                  lastAlertAt = nowMs;
                  if ("accept".equals(action) || "accepted".equals(action)) {
                      pendingUnlock = true;
                      if (AppState.isForeground) runPendingUnlock();
                  }

                  boolean isDriverSide = "ride".equals(kind) || "delivery".equals(kind);
                  // Optional job details JSON (see Worker "payload"). Passed as a properly escaped JS string
                  // literal (JSONObject.quote) - driver.html parses it and shows the card instantly.
                  String payload = intent.getStringExtra("payload");
                  final String payloadArg = (isDriverSide && payload != null && !payload.isEmpty())
                      ? "," + org.json.JSONObject.quote(payload) : "";
                  String page = isDriverSide ? "driver.html" : "partner.html";
                  String jsFunction = isDriverSide ? "handleNativeRideAction" : "handleNativeOrderAction";

                  getBridge().getWebView().post(() -> {
                      // A bare filename like "partner.html" gets treated by
                      // WebView.loadUrl() as its own domain (loads
                      // http://partner.html/ and fails with
                      // ERR_CLEARTEXT_NOT_PERMITTED) instead of a path
                      // inside the app. Capacitor serves the app's www/
                      // folder from https://localhost/ by default, so the
                      // full origin has to be included explicitly.
                      // Already on the right page (driver is using the app)? Do not reload it - just hand
                      // the alert to the page, so an ongoing ride screen is not wiped by a new request.
                      String curUrl = getBridge().getWebView().getUrl();
                      boolean alreadyThere = curUrl != null && curUrl.contains("/" + page);
                      if (!alreadyThere) getBridge().getWebView().loadUrl("https://localhost/" + page);
                      String js = "(function retry(){"
                          + "if (window." + jsFunction + ") {"
                          + "window." + jsFunction + "("
                          + jsString(action) + "," + jsString(id != null ? id : "") + "," + jsString(kind) + payloadArg
                          + ");"
                          + "} else { setTimeout(retry, 300); } })();";
                      getBridge().getWebView().postDelayed(() ->
                          getBridge().getWebView().evaluateJavascript(js, null), alreadyThere ? 0 : 400);
                  });
              }

              private String jsString(String s) {
                  return "'" + s.replace("\\\\", "\\\\\\\\").replace("'", "\\\\'") + "'";
              }
          }

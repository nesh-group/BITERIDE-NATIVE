name: Build Android APK

# Runs entirely on GitHub's own cloud servers — nothing installed on your
# phone or any computer. Triggered manually from the "Actions" tab, or
# automatically every time you push a change to the repo.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (needed by Android build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Generate native Android project (if not already present)
        # This is the step that normally needs a computer with Node.js —
        # running it here means you never need Termux or a laptop at all.
        run: |
          if [ ! -d "android" ]; then
            npx cap init "NESH PARTNER" "com.yourcompany.restaurantpartner" --web-dir www
            npx cap add android
          fi

      - name: Add location permissions to AndroidManifest.xml
        # android/ is regenerated from scratch every run (never committed),
        # and Capacitor does not add location permissions by default even
        # when @capacitor/geolocation is installed — so, same as the
        # Firebase config and notification channel below, this has to be
        # re-applied every single build.
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi

      - name: Generate app icon from resources/icon.png
        # resources/icon.png (1024x1024, committed at the repo root) is
        # rendered into every mipmap density Android needs. Like
        # google-services.json below, this has to be re-applied every
        # single build because android/ is regenerated from scratch each
        # run and is never committed.
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Add Firebase config to the Android project
        # google-services.json is committed at the repo root. The android/
        # folder is regenerated from scratch on every run (it isn't
        # committed), so this file and the Gradle plugin lines below have
        # to be re-applied every single build — otherwise Firebase never
        # "sees" this as a registered Android app.
        run: |
          cp google-services.json android/app/google-services.json

          # Add the google-services classpath to the project-level build.gradle
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          fi

          # Apply the plugin at the bottom of the app-level build.gradle
          if ! grep -q "apply plugin: 'com.google.gms.google-services'" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Add custom alert sounds (order + ride)
        # order_alert.mp3 and ride_alert.mp3 are committed at the repo
        # root. Same reasoning as google-services.json above: android/ is
        # regenerated every build, so both sound files have to be copied
        # into res/raw every time too.
        run: |
          mkdir -p android/app/src/main/res/raw
          cp order_alert.mp3 android/app/src/main/res/raw/order_alert.mp3
          cp ride_alert.mp3 android/app/src/main/res/raw/ride_alert.mp3

      - name: Add notification channels (sound + vibration) to MainActivity
        # android/ is regenerated fresh every build, so MainActivity.java
        # is rewritten here every time rather than committed and edited
        # by hand. This creates BOTH the "order_alerts" channel (used for
        # restaurant orders and driver delivery jobs) and the "ride_alerts"
        # channel (used for taxi ride requests — the Cloudflare Worker
        # sends ride pushes with channel_id: "ride_alerts", so that channel
        # must exist on the device with its own sound or Android silently
        # falls back to no custom sound/vibration). This is what makes the
        # alert work even when the app is fully closed/killed, since
        # Android's own OS reads these channels, not any JS/web code.
        run: |
          PKG_PATH="android/app/src/main/java/com/yourcompany/restaurantpartner"
          cat > "$PKG_PATH/MainActivity.java" << 'EOF'
          package com.yourcompany.restaurantpartner;
          
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.ContentResolver;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      AudioAttributes audioAttributes = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();
          
                      // Orders + driver delivery jobs
                      Uri soundUri = Uri.parse(ContentResolver.SCHEME_ANDROID_RESOURCE + "://" + getPackageName() + "/raw/order_alert");
                      NotificationChannel channel = new NotificationChannel(
                          "order_alerts", "Order Alerts", NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setSound(soundUri, audioAttributes);
                      channel.enableVibration(true);
                      channel.setVibrationPattern(new long[]{0, 800, 300, 800, 300, 800, 300, 800});
                      channel.setBypassDnd(true);
                      manager.createNotificationChannel(channel);
          
                      // Taxi ride requests
                      Uri rideSoundUri = Uri.parse(ContentResolver.SCHEME_ANDROID_RESOURCE + "://" + getPackageName() + "/raw/ride_alert");
                      NotificationChannel rideChannel = new NotificationChannel(
                          "ride_alerts", "Ride Alerts", NotificationManager.IMPORTANCE_HIGH
                      );
                      rideChannel.setSound(rideSoundUri, audioAttributes);
                      rideChannel.enableVibration(true);
                      rideChannel.setVibrationPattern(new long[]{0, 800, 300, 800, 300, 800, 300, 800});
                      rideChannel.setBypassDnd(true);
                      manager.createNotificationChannel(rideChannel);
                  }
              }
          }
          EOF

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload the built APK
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-partner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

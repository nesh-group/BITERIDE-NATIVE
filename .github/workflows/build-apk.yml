          package com.yourcompany.neshapp;

          import android.content.Intent;
          import androidx.annotation.NonNull;
          import androidx.core.content.ContextCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;

          // The app's sole FCM receiver, handling alerts for BOTH portals.
          // "new_ride" / "new_delivery" -> driver portal, "new_order" ->
          // partner portal. Firebase only allows one
          // FirebaseMessagingService per app, which is why this replaces
          // the driver app's RideAlertFcmService and the partner app's
          // OrderAlertFcmService.
          //
          // Each type carries its id in a different field, matching
          // exactly what the Cloudflare Worker sends and what each web
          // app's JS expects back:
          //   new_ride     -> data.rideId                         (plain)
          //   new_delivery -> data.restId + "::" + data.orderId    (composite —
          //                    driver.html's handlePopupDeliveryAction splits
          //                    on "::" to get restId/orderId back out)
          //   new_order    -> data.orderId                        (plain)
          public class AlertFcmService extends FirebaseMessagingService {
              @Override
              public void onMessageReceived(@NonNull RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
                  Map<String, String> data = remoteMessage.getData();
                  String type = data.get("type");

                  // "cancel_ring" (sent by the Cloudflare Worker's
                  // cancel_ring handler) doesn't start a new alert — it
                  // tells RingingService to stop the CURRENT one, but only
                  // if it's still ringing for this exact kind+id. Without
                  // that match check, a cancel meant for an old, already-
                  // superseded ride could wrongly silence a brand-new one
                  // that started ringing in between.
                  if ("cancel_ring".equals(type)) {
                      RingingService.cancelIfMatches(this, data.get("kind"), data.get("id"));
                      return;
                  }

                  String kind;
                  String id;
                  if ("new_ride".equals(type)) {
                      kind = "ride";
                      id = data.get("rideId");
                  } else if ("new_delivery".equals(type)) {
                      kind = "delivery";
                      id = data.get("restId") + "::" + data.get("orderId");
                  } else if ("new_order".equals(type)) {
                      kind = "order";
                      id = data.get("orderId");
                  } else {
                      return;
                  }

                  // Previously skipped entirely while the app was in the
                  // foreground (AppState.isForeground), relying only on the
                  // in-app popup/vibration from the web app's own Firebase
                  // listener. Now the native ring/notification/full-screen
                  // alert fires every time, same as when the app is closed
                  // — the in-app popup still shows too (via
                  // refreshRidePopupFromCache), so while the app is open
                  // the driver gets both together.

                  Intent serviceIntent = new Intent(this, RingingService.class);
                  serviceIntent.putExtra("kind", kind);
                  serviceIntent.putExtra("id", id);
                  serviceIntent.putExtra("title", data.get("title"));
                  serviceIntent.putExtra("body", data.get("body"));
                  ContextCompat.startForegroundService(this, serviceIntent);
              }
          }

          package com.yourcompany.neshapp;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.core.app.NotificationCompat;

          // Foreground service that loops the alert sound + vibration for
          // as long as a ride or order sits un-answered, even with the app
          // fully closed. Shared by both portals; which sound/channel/label
          // it uses is picked at runtime from the "kind" extra.
          public class RingingService extends Service {
              private static final int NOTIF_ID = 4321;
              // Matches the Cloudflare Worker's NEAREST_TIMEOUT_MS exactly
              // (25s) — past this point the ride/delivery may already have
              // been offered to another driver, so this device's alert
              // should stop on its own even if nobody accepts, rejects, or
              // skips it here. Driver-side ("ride"/"delivery") only — the
              // Worker never reassigns a restaurant's own "order" alert to
              // another restaurant, so there's no matching window to
              // auto-stop against for that kind; it keeps ringing until
              // explicitly accepted/rejected in-app.
              private static final long AUTO_STOP_MS = 25_000;

              private MediaPlayer mediaPlayer;
              private Vibrator vibrator;
              private final Handler timeoutHandler = new Handler(Looper.getMainLooper());
              private Runnable timeoutRunnable;
              // Operator alerts get their own notification id per order, so each
              // new order stays in the tray instead of replacing the last one.
              private int currentNotifId = NOTIF_ID;

              // What this service is currently ringing for, if anything —
              // checked by cancelIfMatches() so a stray/late cancel_ring
              // push for an OLD ride/order can never silence a NEW one
              // that happens to already be ringing by the time it arrives.
              private static volatile String currentKind;
              private static volatile String currentId;

              // Called from AlertFcmService when a "cancel_ring" data push
              // arrives. Only stops the service if it's ringing for this
              // exact kind+id right now — a no-op otherwise (e.g. already
              // stopped, already moved on to a different alert, or this
              // cancel arrived for something this device was never
              // ringing for in the first place).
              // True while this service is ringing for exactly this kind+id (RideAlertActivity uses it
              // to close itself if the alert already ended before the popup came up).
              public static boolean isRinging(String kind, String id) {
                  return kind != null && id != null && kind.equals(currentKind) && id.equals(currentId);
              }

              public static void cancelIfMatches(android.content.Context ctx, String kind, String id) {
                  if (kind == null || id == null) return;
                  if (kind.equals(currentKind) && id.equals(currentId)) {
                      ctx.stopService(new Intent(ctx, RingingService.class));
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String kind = intent.getStringExtra("kind");
                  String id = intent.getStringExtra("id");
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");
                  String payload = intent.getStringExtra("payload");
                  currentKind = kind;
                  currentId = id;

                  // If a second ride/order/delivery arrives while the first
                  // one is still ringing (unanswered), this service gets
                  // started again — without stopping the previous sound
                  // first, the old and new MediaPlayer would both loop at
                  // once. Always clear out any currently-playing sound and
                  // vibration before starting the new one, so only the
                  // latest alert is ever audible.
                  stopRingLoop();
                  if (timeoutRunnable != null) timeoutHandler.removeCallbacks(timeoutRunnable);

                  currentNotifId = "operator".equals(kind) ? (5000 + Math.abs((id == null ? "" : id).hashCode() % 90000)) : NOTIF_ID;
                  startForeground(currentNotifId, buildNotification(kind, id, title, body, payload));
                  // Operator alerts are full-screen but SILENT: no sound, no vibration.
                  // Operator alerts are silent unless this phone's Operator Panel has the
                  // "alert sound" switch on (sound only - no vibration).
                  if (!"operator".equals(kind) || intent.getBooleanExtra("sound", false)) startRingLoop(kind);
                  // Operator vibration: off unless this phone's Operator Panel switched it on.
                  // One short double-buzz (not a loop).
                  if ("operator".equals(kind) && intent.getBooleanExtra("vibrate", false)) vibrateOnce();

                  // Operator alert while the phone is UNLOCKED: Android only shows a
                  // full-screen notification when the phone is locked/idle (otherwise
                  // just a small pop-up). With "Display over other apps" allowed, the
                  // app may open its alert screen itself, so it covers the screen
                  // every time, locked or not.
                  if ("operator".equals(kind) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                          && android.provider.Settings.canDrawOverlays(this)) {
                      try {
                          Intent showAlert = new Intent(this, RingingActivity.class);
                          showAlert.putExtra("kind", kind);
                          showAlert.putExtra("id", id);
                          showAlert.putExtra("title", title);
                          showAlert.putExtra("body", body);
                          showAlert.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          startActivity(showAlert);
                      } catch (Exception ignored) {}
                  }

                  // Ride/delivery alert while the phone is UNLOCKED (or app swiped away): open the
                  // driver app itself straight onto the ride popup. Needs "Display over other apps".
                  if (("ride".equals(kind) || "delivery".equals(kind)) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                          && android.provider.Settings.canDrawOverlays(this)) {
                      try {
                          // App not on screen -> instant native popup (no WebView wait).
                          // App already open -> old path: the in-app popup, screen not reloaded.
                          Intent openApp = new Intent(this, AppState.isForeground ? MainActivity.class : RideAlertActivity.class);
                          openApp.putExtra("kind", kind);
                          openApp.putExtra("action", "open");
                          openApp.putExtra("id", id);
                          openApp.putExtra("title", title);
                          openApp.putExtra("body", body);
                          openApp.putExtra("lockscreen", true);
                          if (payload != null) openApp.putExtra("payload", payload);
                          openApp.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          startActivity(openApp);
                      } catch (Exception ignored) {}
                  }

                  boolean isDriverSide = "ride".equals(kind) || "delivery".equals(kind) || "operator".equals(kind);
                  if (isDriverSide) {
                      if ("operator".equals(kind)) {
                          // After the full-screen alert times out, keep the order
                          // notification in the tray (detach it) until the operator
                          // taps or swipes it away.
                          timeoutRunnable = () -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                  stopForeground(Service.STOP_FOREGROUND_DETACH);
                              }
                              stopSelf();
                          };
                      } else {
                          timeoutRunnable = this::stopSelf;
                      }
                      timeoutHandler.postDelayed(timeoutRunnable, AUTO_STOP_MS);
                  } else {
                      timeoutRunnable = null;
                  }
                  return START_NOT_STICKY;
              }

              private Notification buildNotification(String kind, String id, String title, String body, String payload) {
                  String channelId;
                  String channelName;
                  String defaultTitle;
                  if ("ride".equals(kind)) {
                      channelId = "ride_alerts"; channelName = "Ride Alerts"; defaultTitle = "New Ride Request";
                  } else if ("delivery".equals(kind)) {
                      channelId = "delivery_alerts"; channelName = "Delivery Alerts"; defaultTitle = "New Delivery";
                  } else if ("operator".equals(kind)) {
                      channelId = "operator_silent_alerts"; channelName = "Operator Order Alerts"; defaultTitle = "New order";
                  } else {
                      channelId = "order_ring_alerts"; channelName = "Order Ring Alerts"; defaultTitle = "New Order";
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager.getNotificationChannel(channelId) == null) {
                          NotificationChannel channel = new NotificationChannel(
                              channelId, channelName, NotificationManager.IMPORTANCE_HIGH
                          );
                          channel.setSound(null, null);
                          channel.enableVibration(false);
                          manager.createNotificationChannel(channel);
                      }
                  }

                  boolean driverJob = "ride".equals(kind) || "delivery".equals(kind);
                  // Ride/delivery: lock-screen full-screen intent opens the driver app directly
                  // (MainActivity shows over the lock screen) instead of the "OPEN APP" screen.
                  Intent fullScreenIntent = new Intent(this, driverJob ? MainActivity.class : RingingActivity.class);
                  if (driverJob) { fullScreenIntent.putExtra("action", "open"); fullScreenIntent.putExtra("lockscreen", true); }
                  fullScreenIntent.putExtra("kind", kind);
                  fullScreenIntent.putExtra("id", id);
                  fullScreenIntent.putExtra("title", title);
                  fullScreenIntent.putExtra("body", body);
                  if (driverJob && payload != null) fullScreenIntent.putExtra("payload", payload);
                  fullScreenIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent fullScreenPendingIntent = PendingIntent.getActivity(
                      this, 0, fullScreenIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  // Lock-screen / full-screen path for ride + delivery: the native popup. Tapping the
                  // notification itself still opens the driver app (fallback if a phone blocks the popup).
                  PendingIntent popupPendingIntent = fullScreenPendingIntent;
                  if (driverJob) {
                      Intent popup = new Intent(this, RideAlertActivity.class);
                      popup.putExtra("kind", kind);
                      popup.putExtra("id", id);
                      popup.putExtra("title", title);
                      popup.putExtra("body", body);
                      if (payload != null) popup.putExtra("payload", payload);
                      popup.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      popupPendingIntent = PendingIntent.getActivity(
                          this, 2, popup,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                  }

                  boolean isOperatorAlert = "operator".equals(kind);
                  PendingIntent contentPi = fullScreenPendingIntent;
                  if (isOperatorAlert) {
                      // Tapping the (persistent) operator notification just opens the app.
                      Intent openApp = new Intent(this, MainActivity.class);
                      openApp.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      contentPi = PendingIntent.getActivity(
                          this, 1, openApp,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                      );
                  }

                  NotificationCompat.Builder nb = new NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_menu_call)
                      .setContentTitle(title != null ? title : defaultTitle)
                      .setContentText(body != null ? body : "Tap to view")
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setFullScreenIntent(popupPendingIntent, true)
                      .setContentIntent(contentPi)
                      .setOngoing(!isOperatorAlert)
                      .setAutoCancel(isOperatorAlert);
                  // Operator: bold text, the Malayalam "new order" heading in green, and when
                  // expanded each detail (order #, items, customer) on its own line.
                  if (isOperatorAlert) {
                      final int spanFlag = android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE;
                      String t = title != null ? title : "\u0d2a\u0d41\u0d24\u0d3f\u0d2f \u0d13\u0d7c\u0d21\u0d7c";
                      android.text.SpannableString st = new android.text.SpannableString(t);
                      st.setSpan(new android.text.style.StyleSpan(android.graphics.Typeface.BOLD), 0, t.length(), spanFlag);
                      int sepN = t.indexOf(" \u2014 ");
                      st.setSpan(new android.text.style.ForegroundColorSpan(android.graphics.Color.parseColor("#16a34a")), 0, sepN > 0 ? sepN : t.length(), spanFlag);
                      nb.setContentTitle(st);
                      nb.setColor(android.graphics.Color.parseColor("#16a34a"));
                      if (body != null) {
                          android.text.SpannableString sc = new android.text.SpannableString(body);
                          sc.setSpan(new android.text.style.StyleSpan(android.graphics.Typeface.BOLD), 0, body.length(), spanFlag);
                          nb.setContentText(sc);
                          String big = body.replace(" \u00b7 ", "\n");
                          android.text.SpannableString sbig = new android.text.SpannableString(big);
                          sbig.setSpan(new android.text.style.StyleSpan(android.graphics.Typeface.BOLD), 0, big.length(), spanFlag);
                          nb.setStyle(new NotificationCompat.BigTextStyle().bigText(sbig));
                      }
                  }
                  return nb.build();
              }

              private void vibrateOnce() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      if (v == null) return;
                      long[] p = {0, 300, 150, 300};
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createWaveform(p, -1));
                      } else {
                          v.vibrate(p, -1);
                      }
                  } catch (Exception ignored) {}
              }

              private void startRingLoop(String kind) {
                  try {
                      // Delivery reuses the order_alert sound file (same
                      // asset the old system used for delivery jobs) —
                      // ride gets its own ride_alert sound, and so does a
                      // restaurant order.
                      String soundName = "ride".equals(kind) ? "ride_alert" : "order_alert";
                      Uri soundUri = Uri.parse(android.content.ContentResolver.SCHEME_ANDROID_RESOURCE + "://" + getPackageName() + "/raw/" + soundName);
                      mediaPlayer = new MediaPlayer();
                      mediaPlayer.setDataSource(this, soundUri);
                      mediaPlayer.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build());
                      mediaPlayer.setLooping(true);
                      mediaPlayer.prepare();
                      mediaPlayer.start();
                  } catch (Exception ignored) {
                      // If the sound fails to load for any reason, vibration
                      // below still runs — the user still gets alerted.
                  }

                  if ("operator".equals(kind)) return; // operator alert: sound only, never vibrates
                  vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  if (vibrator != null) {
                      long[] pattern = {0, 800, 300, 800, 300, 800, 300, 800};
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                      } else {
                          vibrator.vibrate(pattern, 0);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  stopRingLoop();
                  if (timeoutRunnable != null) {
                      timeoutHandler.removeCallbacks(timeoutRunnable);
                      timeoutRunnable = null;
                  }
                  // Tell RideAlertActivity (if it is showing) that this alert is over: 25 s timeout,
                  // cancel_ring, accept or skip all end up here.
                  try {
                      Intent stopped = new Intent("com.yourcompany.neshapp.RING_STOPPED");
                      stopped.setPackage(getPackageName());
                      stopped.putExtra("kind", currentKind);
                      stopped.putExtra("id", currentId);
                      sendBroadcast(stopped);
                  } catch (Exception ignored) {}
                  currentKind = null;
                  currentId = null;
              }

              private void stopRingLoop() {
                  if (mediaPlayer != null) {
                      try { mediaPlayer.stop(); mediaPlayer.release(); } catch (Exception ignored) {}
                      mediaPlayer = null;
                  }
                  if (vibrator != null) {
                      vibrator.cancel();
                      vibrator = null;
                  }
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }

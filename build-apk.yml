name: Build Combined APK (Driver + Partner)

# Runs entirely on GitHub's own cloud servers — nothing installed on your
# phone or any computer. Triggered manually from the "Actions" tab, or
# automatically every time you push a change to the repo.
#
# This replaces build-apk-driver.yml and build-apk-partner.yml. Instead of
# two separate apps, it produces ONE apk with a home screen where the user
# picks "Driver" or "Restaurant Partner". Your www/ folder must contain:
#   www/index.html   <- portal chooser (new)
#   www/driver.html  <- old driver-app.html, renamed
#   www/partner.html <- old partner-app.html, renamed
#   www/manifest.json, www/icon-192.png, www/icon-512.png (shared, as before)
#
# IMPORTANT: because there is now only one app package
# (com.yourcompany.neshapp instead of two), you must register a NEW
# Android app with this exact package name in your Firebase project and
# replace google-services.json at the repo root with the one Firebase
# gives you for it. The old google-services.json (registered under
# com.yourcompany.restaurantpartner) will NOT work here.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (needed by Android build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Generate native Android project (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap init "NESH" "com.yourcompany.neshapp" --web-dir www
            npx cap add android
          fi

      - name: Add permissions and native components to AndroidManifest.xml
        # android/ is regenerated from scratch every run (never committed),
        # so every permission and every custom native component has to be
        # re-applied here every single build.
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi

          if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />' "$MANIFEST"
          fi

          # Register ONE AlertFcmService as the app's sole FCM receiver.
          # Firebase only allows a single FirebaseMessagingService per app,
          # which is exactly why the driver app's RideAlertFcmService and
          # the partner app's OrderAlertFcmService had to be merged into
          # one class (AlertFcmService, added further down) instead of
          # registering two.
          if ! grep -q "AlertFcmService" "$MANIFEST"; then
            python3 - "$MANIFEST" << 'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          injection = '''
              <service android:name=".AlertFcmService" android:exported="false">
                  <intent-filter>
                      <action android:name="com.google.firebase.MESSAGING_EVENT" />
                  </intent-filter>
              </service>
              <service android:name=".RingingService" android:exported="false" android:foregroundServiceType="mediaPlayback" />
              <activity android:name=".RingingActivity"
                  android:exported="false"
                  android:launchMode="singleInstance"
                  android:excludeFromRecents="true"
                  android:showOnLockScreen="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" />
          </application>'''
          content = content.replace('</application>', injection, 1)
          with open(path, 'w') as f:
              f.write(content)
          PYEOF
          fi

      - name: Generate app icon from resources/icon.png
        run: |
          npm install -D @capacitor/assets
          npx capacitor-assets generate --android

      - name: Add Firebase config to the Android project
        # google-services.json must be the one Firebase generates for the
        # com.yourcompany.neshapp package (see note at the top of this file).
        run: |
          cp google-services.json android/app/google-services.json

          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          fi

          if ! grep -q "apply plugin: 'com.google.gms.google-services'" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Add Firebase Messaging and AndroidX dependencies
        run: |
          if ! grep -q "firebase-messaging" android/app/build.gradle; then
            sed -i "/dependencies {/a\\    implementation 'com.google.firebase:firebase-messaging:23.4.0'\n    implementation 'androidx.annotation:annotation:1.7.1'" android/app/build.gradle
          fi

      - name: Add custom alert sounds (order + ride)
        # Both sound files are needed since a single app now handles both
        # kinds of alerts.
        run: |
          mkdir -p android/app/src/main/res/raw
          cp order_alert.mp3 android/app/src/main/res/raw/order_alert.mp3
          cp ride_alert.mp3 android/app/src/main/res/raw/ride_alert.mp3

      - name: Add native alert-handling classes
        # android/ is regenerated fresh every build, so all Java files are
        # rewritten here every time rather than committed and edited by
        # hand. AlertFcmService/RingingService/RingingActivity are shared
        # by BOTH portals; MainActivity routes to driver.html or
        # partner.html depending on which kind of alert was tapped.
        run: |
          PKG_PATH="android/app/src/main/java/com/yourcompany/neshapp"
          mkdir -p "$PKG_PATH"

          cat > "$PKG_PATH/AppState.java" << 'EOF'
          package com.yourcompany.neshapp;

          // Tracks whether an Activity of this app is currently visible, so
          // AlertFcmService can decide whether to hand an alert to the
          // already-open web app (in-app popup/ring) or start the native
          // full-screen ringing screen instead. NOTE: this is app-wide, not
          // per-portal — if you want a ride alert to still ring natively
          // while the partner portal is open (or vice versa), this flag
          // needs to be made portal-aware.
          public class AppState {
              public static volatile boolean isForeground = false;
          }
          EOF

          cat > "$PKG_PATH/MainActivity.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.ContentResolver;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      AudioAttributes audioAttributes = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();

                      Uri orderUri = Uri.parse(ContentResolver.SCHEME_ANDROID_RESOURCE + "://" + getPackageName() + "/raw/order_alert");
                      NotificationChannel legacyChannel = new NotificationChannel(
                          "order_alerts", "Order Alerts", NotificationManager.IMPORTANCE_HIGH
                      );
                      legacyChannel.setSound(orderUri, audioAttributes);
                      legacyChannel.enableVibration(true);
                      legacyChannel.setVibrationPattern(new long[]{0, 800, 300, 800, 300, 800, 300, 800});
                      legacyChannel.setBypassDnd(true);
                      manager.createNotificationChannel(legacyChannel);
                  }

                  handleIncomingIntent(getIntent());
              }

              @Override
              public void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIncomingIntent(intent);
              }

              @Override
              public void onResume() {
                  super.onResume();
                  AppState.isForeground = true;
              }

              @Override
              public void onPause() {
                  super.onPause();
                  AppState.isForeground = false;
              }

              // If this launch came from the native ringing screen (user
              // tapped Accept/Reject/Open while the app was closed), first
              // navigate the WebView to the right portal page, then forward
              // the action into that page's own JS once it has finished
              // loading. window.handleNativeRideAction (used for both
              // "ride" and "delivery" kinds — driver.html's own
              // handlePopupItemAction already branches on the kind
              // argument) / window.handleNativeOrderAction (used for
              // "order") self-retry until the page's own script is ready,
              // so exact WebView load timing doesn't matter.
              //
              // "kind" is one of "ride" / "delivery" / "order" and comes
              // straight from RingingActivity, which itself derived it from
              // the FCM push's "type" field (new_ride / new_delivery /
              // new_order). The three kinds need different id formats:
              //   ride     -> plain rideId
              //   delivery -> composite "restId::orderId" (that's the exact
              //               format driver.html's handlePopupDeliveryAction
              //               expects — see RingingActivity for where this
              //               composite id gets built)
              //   order    -> plain orderId
              private void handleIncomingIntent(Intent intent) {
                  if (intent == null) return;
                  String kind = intent.getStringExtra("kind");
                  String action = intent.getStringExtra("action");
                  String id = intent.getStringExtra("id");
                  if (kind == null || action == null) return;

                  boolean isDriverSide = "ride".equals(kind) || "delivery".equals(kind);
                  String page = isDriverSide ? "driver.html" : "partner.html";
                  String jsFunction = isDriverSide ? "handleNativeRideAction" : "handleNativeOrderAction";

                  getBridge().getWebView().post(() -> {
                      // A bare filename like "partner.html" gets treated by
                      // WebView.loadUrl() as its own domain (loads
                      // http://partner.html/ and fails with
                      // ERR_CLEARTEXT_NOT_PERMITTED) instead of a path
                      // inside the app. Capacitor serves the app's www/
                      // folder from https://localhost/ by default, so the
                      // full origin has to be included explicitly.
                      getBridge().getWebView().loadUrl("https://localhost/" + page);
                      String js = "(function retry(){"
                          + "if (window." + jsFunction + ") {"
                          + "window." + jsFunction + "("
                          + jsString(action) + "," + jsString(id != null ? id : "") + "," + jsString(kind)
                          + ");"
                          + "} else { setTimeout(retry, 300); } })();";
                      getBridge().getWebView().postDelayed(() ->
                          getBridge().getWebView().evaluateJavascript(js, null), 400);
                  });
              }

              private String jsString(String s) {
                  return "'" + s.replace("\\\\", "\\\\\\\\").replace("'", "\\\\'") + "'";
              }
          }
          EOF

          cat > "$PKG_PATH/AlertFcmService.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.content.Intent;
          import androidx.annotation.NonNull;
          import androidx.core.content.ContextCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;

          // The app's sole FCM receiver, handling alerts for BOTH portals.
          // "new_ride" / "new_delivery" -> driver portal, "new_order" ->
          // partner portal. Firebase only allows one
          // FirebaseMessagingService per app, which is why this replaces
          // the driver app's RideAlertFcmService and the partner app's
          // OrderAlertFcmService.
          //
          // Each type carries its id in a different field, matching
          // exactly what the Cloudflare Worker sends and what each web
          // app's JS expects back:
          //   new_ride     -> data.rideId                         (plain)
          //   new_delivery -> data.restId + "::" + data.orderId    (composite —
          //                    driver.html's handlePopupDeliveryAction splits
          //                    on "::" to get restId/orderId back out)
          //   new_order    -> data.orderId                        (plain)
          public class AlertFcmService extends FirebaseMessagingService {
              @Override
              public void onMessageReceived(@NonNull RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
                  Map<String, String> data = remoteMessage.getData();
                  String type = data.get("type");

                  String kind;
                  String id;
                  if ("new_ride".equals(type)) {
                      kind = "ride";
                      id = data.get("rideId");
                  } else if ("new_delivery".equals(type)) {
                      kind = "delivery";
                      id = data.get("restId") + "::" + data.get("orderId");
                  } else if ("new_order".equals(type)) {
                      kind = "order";
                      id = data.get("orderId");
                  } else {
                      return;
                  }

                  if (AppState.isForeground) return;

                  Intent serviceIntent = new Intent(this, RingingService.class);
                  serviceIntent.putExtra("kind", kind);
                  serviceIntent.putExtra("id", id);
                  serviceIntent.putExtra("title", data.get("title"));
                  serviceIntent.putExtra("body", data.get("body"));
                  ContextCompat.startForegroundService(this, serviceIntent);
              }
          }
          EOF

          cat > "$PKG_PATH/RingingService.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.core.app.NotificationCompat;

          // Foreground service that loops the alert sound + vibration for
          // as long as a ride or order sits un-answered, even with the app
          // fully closed. Shared by both portals; which sound/channel/label
          // it uses is picked at runtime from the "kind" extra.
          public class RingingService extends Service {
              private static final int NOTIF_ID = 4321;

              private MediaPlayer mediaPlayer;
              private Vibrator vibrator;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String kind = intent.getStringExtra("kind");
                  String id = intent.getStringExtra("id");
                  String title = intent.getStringExtra("title");
                  String body = intent.getStringExtra("body");

                  startForeground(NOTIF_ID, buildNotification(kind, id, title, body));
                  startRingLoop(kind);
                  return START_NOT_STICKY;
              }

              private Notification buildNotification(String kind, String id, String title, String body) {
                  String channelId;
                  String channelName;
                  String defaultTitle;
                  if ("ride".equals(kind)) {
                      channelId = "ride_alerts"; channelName = "Ride Alerts"; defaultTitle = "New Ride Request";
                  } else if ("delivery".equals(kind)) {
                      channelId = "delivery_alerts"; channelName = "Delivery Alerts"; defaultTitle = "New Delivery";
                  } else {
                      channelId = "order_ring_alerts"; channelName = "Order Ring Alerts"; defaultTitle = "New Order";
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager.getNotificationChannel(channelId) == null) {
                          NotificationChannel channel = new NotificationChannel(
                              channelId, channelName, NotificationManager.IMPORTANCE_HIGH
                          );
                          channel.setSound(null, null);
                          channel.enableVibration(false);
                          manager.createNotificationChannel(channel);
                      }
                  }

                  Intent fullScreenIntent = new Intent(this, RingingActivity.class);
                  fullScreenIntent.putExtra("kind", kind);
                  fullScreenIntent.putExtra("id", id);
                  fullScreenIntent.putExtra("title", title);
                  fullScreenIntent.putExtra("body", body);
                  fullScreenIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent fullScreenPendingIntent = PendingIntent.getActivity(
                      this, 0, fullScreenIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  return new NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_menu_call)
                      .setContentTitle(title != null ? title : defaultTitle)
                      .setContentText(body != null ? body : "Tap to view")
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setFullScreenIntent(fullScreenPendingIntent, true)
                      .setContentIntent(fullScreenPendingIntent)
                      .setOngoing(true)
                      .setAutoCancel(false)
                      .build();
              }

              private void startRingLoop(String kind) {
                  try {
                      // Delivery reuses the order_alert sound file (same
                      // asset the old system used for delivery jobs) —
                      // ride gets its own ride_alert sound, and so does a
                      // restaurant order.
                      String soundName = "ride".equals(kind) ? "ride_alert" : "order_alert";
                      Uri soundUri = Uri.parse(android.content.ContentResolver.SCHEME_ANDROID_RESOURCE + "://" + getPackageName() + "/raw/" + soundName);
                      mediaPlayer = new MediaPlayer();
                      mediaPlayer.setDataSource(this, soundUri);
                      mediaPlayer.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build());
                      mediaPlayer.setLooping(true);
                      mediaPlayer.prepare();
                      mediaPlayer.start();
                  } catch (Exception ignored) {
                      // If the sound fails to load for any reason, vibration
                      // below still runs — the user still gets alerted.
                  }

                  vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                  if (vibrator != null) {
                      long[] pattern = {0, 800, 300, 800, 300, 800, 300, 800};
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(VibrationEffect.createWaveform(pattern, 0));
                      } else {
                          vibrator.vibrate(pattern, 0);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (mediaPlayer != null) {
                      try { mediaPlayer.stop(); mediaPlayer.release(); } catch (Exception ignored) {}
                      mediaPlayer = null;
                  }
                  if (vibrator != null) {
                      vibrator.cancel();
                      vibrator = null;
                  }
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat > "$PKG_PATH/RingingActivity.java" << 'EOF'
          package com.yourcompany.neshapp;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          // Full-screen "incoming alert" screen shown on top of the lock
          // screen while the app was fully closed. Shared by both portals:
          // shows Accept/Reject for rides (driver portal), Accept/Open App
          // for orders (partner portal — rejection needs a typed reason,
          // which only the web app's own modal can collect).
          public class RingingActivity extends Activity {
              private String alertId;
              private String kind; // "ride" / "delivery" / "order"

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                      KeyguardManager km = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);
                      if (km != null) km.requestDismissKeyguard(this, null);
                  } else {
                      getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                              | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                              | WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                      );
                  }

                  kind = getIntent().getStringExtra("kind");
                  alertId = getIntent().getStringExtra("id");
                  String title = getIntent().getStringExtra("title");
                  String body = getIntent().getStringExtra("body");
                  String defaultTitle = "delivery".equals(kind) ? "New Delivery"
                      : "order".equals(kind) ? "New Order" : "New Ride Request";

                  setContentView(buildLayout(
                      title != null ? title : defaultTitle,
                      body != null ? body : ""
                  ));
              }

              private LinearLayout buildLayout(String title, String body) {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(60, 60, 60, 60);
                  root.setBackgroundColor(Color.parseColor("#1a1a2e"));

                  TextView titleView = new TextView(this);
                  titleView.setText(title);
                  titleView.setTextColor(Color.WHITE);
                  titleView.setTextSize(24);
                  titleView.setGravity(Gravity.CENTER);
                  root.addView(titleView);

                  TextView bodyView = new TextView(this);
                  bodyView.setText(body);
                  bodyView.setTextColor(Color.LTGRAY);
                  bodyView.setTextSize(16);
                  bodyView.setGravity(Gravity.CENTER);
                  bodyView.setPadding(0, 24, 0, 80);
                  root.addView(bodyView);

                  Button acceptBtn = new Button(this);
                  acceptBtn.setText("ACCEPT");
                  acceptBtn.setBackgroundColor(Color.parseColor("#22c55e"));
                  acceptBtn.setTextColor(Color.WHITE);
                  acceptBtn.setOnClickListener(v -> finishWith("accept"));
                  root.addView(acceptBtn);

                  Button secondBtn = new Button(this);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  params.topMargin = 24;
                  secondBtn.setLayoutParams(params);
                  // Ride and delivery (both driver-side) get a blind
                  // Reject; a restaurant order's "reject" needs a typed
                  // reason that only the partner app's own modal can
                  // collect, so it gets "Open App" instead.
                  boolean canRejectBlind = "ride".equals(kind) || "delivery".equals(kind);
                  if (canRejectBlind) {
                      secondBtn.setText("REJECT");
                      secondBtn.setBackgroundColor(Color.parseColor("#ef4444"));
                      secondBtn.setOnClickListener(v -> finishWith("reject"));
                  } else {
                      secondBtn.setText("OPEN APP");
                      secondBtn.setBackgroundColor(Color.parseColor("#6b7280"));
                      secondBtn.setOnClickListener(v -> finishWith("open"));
                  }
                  secondBtn.setTextColor(Color.WHITE);
                  root.addView(secondBtn);

                  return root;
              }

              private void finishWith(String action) {
                  stopService(new Intent(this, RingingService.class));

                  Intent launch = new Intent(this, MainActivity.class);
                  launch.putExtra("kind", kind);
                  launch.putExtra("action", action);
                  launch.putExtra("id", alertId);
                  launch.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  startActivity(launch);
                  finish();
              }

              @Override
              public void onBackPressed() {
                  // Ignore back button — user must tap one of the buttons,
                  // same as an incoming call screen.
              }
          }
          EOF

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload the built APK
        uses: actions/upload-artifact@v4
        with:
          name: nesh-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

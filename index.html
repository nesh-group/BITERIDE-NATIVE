<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NESH</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#17A9E0">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B2545;
    --marigold:#2F80ED;
    --chili:#E5484D;
    --leaf:#17A9E0;
    --cloud:#FFFFFF;
    --muted:#A9C4E0;
    --muted-2:#6E8CAE;
    --field-bg:#123A5E;
    --field-border:#1D4E7A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--ink); font-family:'Inter',sans-serif;
    display:flex; justify-content:center; min-height:100vh;
  }
  #picker{ width:100%; max-width:420px; min-height:100vh; background:var(--ink); position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:16px; }
  @media (min-width:641px){
    body{ background:linear-gradient(160deg,#081b32,#0B2545 55%,#0d2c4d); align-items:flex-start; padding:32px 16px; }
    #picker{ min-height:calc(100vh - 64px); border-radius:28px; box-shadow:0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06); }
  }
  .eyebrow{ color:var(--marigold); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:2px; margin:0 0 4px; text-align:center; }
  .title{ color:var(--cloud); font-family:'Fraunces',serif; font-size:30px; font-weight:700; margin:0 0 32px; text-align:center; }
  .role-btn{
    width:100%; max-width:320px; padding:20px; border-radius:16px; border:1px solid var(--field-border);
    background:var(--field-bg); color:var(--cloud); font-family:'Inter',sans-serif; font-size:17px; font-weight:600;
    text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:4px; transition:transform .15s, background .15s;
    text-decoration:none;
  }
  .role-btn:active{ transform:scale(0.98); }
  .role-btn:hover{ background:#16436c; }
  .role-btn small{ color:var(--muted); font-weight:400; font-size:13px; }
  .role-btn.driver{ border-color:#2F80ED; }
  .role-btn.partner{ border-color:#17A9E0; }
</style>
</head>
<body>

<div id="picker">
  <p class="eyebrow">NESH</p>
  <h1 class="title">Choose your app</h1>
  <a class="role-btn driver" href="./driver-app.html">
    NESH Driver
    <small>For delivery &amp; ride drivers</small>
  </a>
  <a class="role-btn partner" href="./partner-app.html">
    NESH Partner
    <small>For shop owners &amp; operators</small>
  </a>
</div>

<script>
  // If the user picked an app before, skip straight to it next time.
  // (Each app page still has its own back/switch link — see note below.)
  try {
    const last = localStorage.getItem('nesh_last_app');
    if (last === 'driver') location.replace('./driver-app.html');
    else if (last === 'partner') location.replace('./partner-app.html');
  } catch(e){}

  document.querySelectorAll('.role-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const role = btn.classList.contains('driver') ? 'driver' : 'partner';
      try { localStorage.setItem('nesh_last_app', role); } catch(e){}
    });
  });
</script>

</body>
</html>
